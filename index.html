<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModelMatchup — AI Image Rater</title>
  <meta name="theme-color" content="#050c0a" />
  <style>
    html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .loaderCard{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}
    .loaderTitle{font-size:18px;font-weight:700;margin-bottom:8px}
    .loaderDetail{color:#8fb0a1}
    .loaderError{white-space:pre-wrap;text-align:left;color:#ffb4be;margin-top:12px}
  </style>
</head>
<body>
  <div class="loader">
    <div class="loaderCard">
      <div class="loaderTitle">Loading ComfortOtter…</div>
      <div class="loaderDetail">Preparing your image library.</div>
      <div id="loaderError" class="loaderError"></div>
    </div>
  </div>

  <script type="text/plain" id="tourneyIndexPatch">
      html = applyOnce(
        html,
        `    async function idbGetAll(){`,
        `    const TOURNEY_INDEX_DB_NAME = 'modelMatchupTourneyIndexDB';
    const TOURNEY_INDEX_STORE = 'items';
    const TOURNEY_INDEX_META_ID = '__meta__';

    function openTourneyIndexDB(){
      return new Promise((resolve,reject)=>{
        if(typeof indexedDB === 'undefined'){
          reject(new Error('IndexedDB unavailable for tournament index.'));
          return;
        }
        let settled = false;
        let req;
        try{ req = indexedDB.open(TOURNEY_INDEX_DB_NAME,1); }
        catch(err){ reject(err); return; }
        const timeoutId = setTimeout(()=>{
          if(settled) return;
          settled = true;
          reject(new Error('Timed out opening tournament index.'));
        },10000);
        const finish = fn=>{
          if(settled) return;
          settled = true;
          clearTimeout(timeoutId);
          fn();
        };
        req.onupgradeneeded = ()=>{
          const db = req.result;
          if(!db.objectStoreNames.contains(TOURNEY_INDEX_STORE)){
            db.createObjectStore(TOURNEY_INDEX_STORE,{keyPath:'id'});
          }
        };
        req.onsuccess = ()=>finish(()=>resolve(req.result));
        req.onerror = ()=>finish(()=>reject(req.error || new Error('Failed to open tournament index.')));
        req.onblocked = ()=>finish(()=>reject(new Error('Tournament index is blocked by another page.')));
      });
    }

    function tourneyIndexSlim(item){
      if(!item || !item.id) return null;
      const hasThumb = !!(item.thumbnail || item.thumbDataUrl || item.hasThumb);
      const { dataUrl, thumbnail, thumbDataUrl, ...rest } = item;
      return { ...rest, id:item.id, hasThumb };
    }

    async function tourneyIndexReplaceAll(sourceItems){
      const rows = (Array.isArray(sourceItems) ? sourceItems : [])
        .map(tourneyIndexSlim)
        .filter(Boolean);
      const db = await openTourneyIndexDB();
      return new Promise((resolve,reject)=>{
        let settled = false;
        const finish = fn=>{
          if(settled) return;
          settled = true;
          try{ db.close(); }catch(_e){}
          fn();
        };
        try{
          const tx = db.transaction(TOURNEY_INDEX_STORE,'readwrite');
          const st = tx.objectStore(TOURNEY_INDEX_STORE);
          st.clear();
          for(const row of rows) st.put(row);
          st.put({id:TOURNEY_INDEX_META_ID,complete:true,builtAt:Date.now(),itemCount:rows.length});
          tx.oncomplete = ()=>finish(resolve);
          tx.onerror = ()=>finish(()=>reject(tx.error || new Error('Tournament index rebuild failed.')));
          tx.onabort = ()=>finish(()=>reject(tx.error || new Error('Tournament index rebuild aborted.')));
        }catch(err){
          finish(()=>reject(err));
        }
      });
    }

    async function tourneyIndexPutItems(sourceItems){
      const rows = (Array.isArray(sourceItems) ? sourceItems : [sourceItems])
        .map(tourneyIndexSlim)
        .filter(Boolean);
      if(!rows.length) return;
      const db = await openTourneyIndexDB();
      return new Promise((resolve,reject)=>{
        let failed = false;
        const finish = (fn)=>{
          if(failed) return;
          failed = true;
          try{ db.close(); }catch(_e){}
          fn();
        };
        try{
          const tx = db.transaction(TOURNEY_INDEX_STORE,'readwrite');
          const st = tx.objectStore(TOURNEY_INDEX_STORE);
          for(const row of rows){
            const req = st.get(row.id);
            req.onsuccess = ()=>{
              const existing = req.result || {};
              st.put({...existing,...row,hasThumb:!!(existing.hasThumb || row.hasThumb)});
            };
            req.onerror = ()=>st.put(row);
          }
          const metaReq = st.get(TOURNEY_INDEX_META_ID);
          metaReq.onsuccess = ()=>{
            const meta = metaReq.result;
            if(meta) st.put({...meta,builtAt:Date.now()});
          };
          tx.oncomplete = ()=>{
            if(failed) return;
            failed = true;
            try{ db.close(); }catch(_e){}
            resolve();
          };
          tx.onerror = ()=>finish(()=>reject(tx.error || new Error('Tournament index update failed.')));
          tx.onabort = ()=>finish(()=>reject(tx.error || new Error('Tournament index update aborted.')));
        }catch(err){
          finish(()=>reject(err));
        }
      });
    }

    async function tourneyIndexDelete(id){
      if(!id) return;
      const db = await openTourneyIndexDB();
      return new Promise((resolve,reject)=>{
        let settled = false;
        const finish = fn=>{
          if(settled) return;
          settled = true;
          try{ db.close(); }catch(_e){}
          fn();
        };
        try{
          const tx = db.transaction(TOURNEY_INDEX_STORE,'readwrite');
          const st = tx.objectStore(TOURNEY_INDEX_STORE);
          st.delete(id);
          const metaReq = st.get(TOURNEY_INDEX_META_ID);
          metaReq.onsuccess = ()=>{
            const meta = metaReq.result;
            if(meta) st.put({...meta,builtAt:Date.now()});
          };
          tx.oncomplete = ()=>finish(resolve);
          tx.onerror = ()=>finish(()=>reject(tx.error || new Error('Tournament index delete failed.')));
          tx.onabort = ()=>finish(()=>reject(tx.error || new Error('Tournament index delete aborted.')));
        }catch(err){
          finish(()=>reject(err));
        }
      });
    }

    async function idbGetAll(){`,
        'add lightweight tournament index helpers'
      );

      html = applyOnce(
        html,
        `      const baseItems = await idbGetAllBase();`,
        `      const baseItems = await idbGetAllBase();
      tourneyIndexReplaceAll(baseItems).catch(err=>{
        console.warn('Could not refresh tournament index from library load.',err);
      });`,
        'refresh tournament index during library load'
      );

      html = applyOnce(
        html,
        `      try{
        await fastStatsPutItems([item]);
      }catch(err){
        console.warn('Could not mirror item stats to lightweight store.',err);
      }
      return result;`,
        `      try{
        await fastStatsPutItems([item]);
      }catch(err){
        console.warn('Could not mirror item stats to lightweight store.',err);
      }
      try{
        await tourneyIndexPutItems([item]);
      }catch(err){
        console.warn('Could not mirror item to tournament index.',err);
      }
      return result;`,
        'mirror merged item to tournament index'
      );

      html = applyOnce(
        html,
        `      try{
        await fastStatsPutItems(items);
      }catch(err){
        console.warn('Could not mirror bulk item stats to lightweight store.',err);
      }
      return result;`,
        `      try{
        await fastStatsPutItems(items);
      }catch(err){
        console.warn('Could not mirror bulk item stats to lightweight store.',err);
      }
      try{
        await tourneyIndexPutItems(items);
      }catch(err){
        console.warn('Could not mirror bulk items to tournament index.',err);
      }
      return result;`,
        'mirror merged bulk items to tournament index'
      );

      html = applyOnce(
        html,
        `      try{
        await fastStatsDelete(id);
      }catch(err){
        console.warn('Could not remove lightweight stats for deleted item.',err);
      }
      return result;`,
        `      try{
        await fastStatsDelete(id);
      }catch(err){
        console.warn('Could not remove lightweight stats for deleted item.',err);
      }
      try{
        await tourneyIndexDelete(id);
      }catch(err){
        console.warn('Could not remove deleted item from tournament index.',err);
      }
      return result;`,
        'remove deleted item from tournament index'
      );

      html = applyOnce(
        html,
        `        tx.oncomplete = () => {
          res();
          if (window.saveItemToCloud) window.saveItemToCloud(item);
        };`,
        `        tx.oncomplete = () => {
          tourneyIndexPutItems([item]).catch(err=>console.warn('Could not add item to tournament index.',err));
          res();
          if (window.saveItemToCloud) window.saveItemToCloud(item);
        };`,
        'mirror direct item put to tournament index'
      );

      html = applyOnce(
        html,
        `        tx.oncomplete = () => {
          try{ db.close(); }catch(e){}
          res();
        };`,
        `        tx.oncomplete = () => {
          try{ db.close(); }catch(e){}
          tourneyIndexPutItems(items).catch(err=>console.warn('Could not add bulk items to tournament index.',err));
          res();
        };`,
        'mirror direct bulk put to tournament index'
      );

      const tourneyIndexRequired = [
        "const TOURNEY_INDEX_DB_NAME = 'modelMatchupTourneyIndexDB'",
        'async function tourneyIndexReplaceAll(sourceItems)',
        'async function tourneyIndexPutItems(sourceItems)',
        'async function tourneyIndexDelete(id)',
        'tourneyIndexReplaceAll(baseItems).catch',
        'await tourneyIndexPutItems([item]);',
        'await tourneyIndexDelete(id);'
      ];
      const missingTourneyIndex = tourneyIndexRequired.filter(snippet=>!html.includes(snippet));
      if(missingTourneyIndex.length){
        throw new Error('Tournament index patch validation failed: ' + missingTourneyIndex.join(', '));
      }
  </script>

  <script>
    (async function loadComfortOtterWithTournamentIndex(){
      const priorRevision = '6ad55663dc7aaeb6bd9a6e7397f47de7ca672d71';
      const loaderSources = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@' + priorRevision + '/index.html',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/' + priorRevision + '/index.html'
      ];
      const warmUrls = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@f602aab7dc142ab280c7480a6f41f5fdc9a942c4/index.html',
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@ed3933d115c3da2438ba1a8f076373727b33cc3f/.github/scripts/add_image_rating.py'
      ];

      async function fetchFirst(urls){
        let lastError = null;
        for(const url of urls){
          try{
            const response = await fetch(url,{cache:'force-cache'});
            if(!response.ok) throw new Error(response.status + ' ' + response.statusText);
            return await response.text();
          }catch(error){
            lastError = error;
          }
        }
        throw lastError || new Error('Could not load ComfortOtter code.');
      }

      const loaderPromise = fetchFirst(loaderSources);
      for(const url of warmUrls){
        fetch(url,{cache:'force-cache'}).catch(()=>{});
      }
      let loader = await loaderPromise;

      const marker = '      const required = [';
      const count = loader.split(marker).length - 1;
      if(count !== 1){
        throw new Error('ComfortOtter tournament-index loader could not find its patch point.');
      }
      const patch = document.getElementById('tourneyIndexPatch').textContent;
      loader = loader.replace(marker,patch + '\n' + marker);

      document.open();
      document.write(loader);
      document.close();
    })().catch(error=>{
      console.error('ComfortOtter tournament-index loader failed',error);
      const target = document.getElementById('loaderError');
      if(target){
        target.textContent = 'ComfortOtter could not finish loading.\n\n' +
          (error && error.message ? error.message : error) +
          '\n\nReload the page to try again.';
      }
    });
  </script>
</body>
</html>
