<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModelMatchup — AI Image Rater</title>
  <meta name="theme-color" content="#050c0a" />
  <style>
    html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .loaderCard{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}
    .loaderTitle{font-size:18px;font-weight:700;margin-bottom:8px}
    .loaderDetail{color:#8fb0a1}
    .loaderError{white-space:pre-wrap;text-align:left;color:#ffb4be;margin-top:12px}
  </style>
</head>
<body>
  <div class="loader">
    <div class="loaderCard">
      <div class="loaderTitle">Loading ComfortOtter…</div>
      <div class="loaderDetail">Preparing your image library.</div>
      <div id="loaderError" class="loaderError"></div>
    </div>
  </div>
  <script>
    (async function loadComfortOtter(){
      const appSources = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@f602aab7dc142ab280c7480a6f41f5fdc9a942c4/index.html',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/f602aab7dc142ab280c7480a6f41f5fdc9a942c4/index.html'
      ];
      const patchSources = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@ed3933d115c3da2438ba1a8f076373727b33cc3f/.github/scripts/add_image_rating.py',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/ed3933d115c3da2438ba1a8f076373727b33cc3f/.github/scripts/add_image_rating.py'
      ];

      async function fetchFirst(urls, label){
        let lastError = null;
        for(const url of urls){
          try{
            const response = await fetch(url, {cache:'force-cache'});
            if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
            return await response.text();
          }catch(error){
            lastError = error;
          }
        }
        throw new Error(`Could not load ${label}: ${lastError && lastError.message ? lastError.message : lastError}`);
      }

      function countOccurrences(text, search){
        if(!search) return 0;
        return text.split(search).length - 1;
      }

      function applyOnce(text, oldText, newText, label){
        const count = countOccurrences(text, oldText);
        if(count === 1) return text.replace(oldText, newText);

        if(label === 'modal rating input' && count === 0){
          const winsInputPattern = /<input\s*\n\s*type="number"\s*\n\s*min="0"\s*\n\s*value=\{editedWins\}/g;
          const matches = text.match(winsInputPattern) || [];
          if(matches.length === 1){
            const ratingInput = `<input
                  type="number"
                  min="0"
                  max="100"
                  step="1"
                  value={editedRating}
                  onChange={e=>setEditedRating(e.target.value)}
                  className="input"
                  placeholder="Rating (0-100)"
                />
                `;
            return text.replace(winsInputPattern, match => `${ratingInput}${match}`);
          }
        }

        throw new Error(`${label}: expected 1 match, found ${count}`);
      }

      function applyEvery(text, oldText, newText, expected, label){
        const count = countOccurrences(text, oldText);
        if(count === expected) return text.split(oldText).join(newText);

        if(label === 'rating sort options'){
          const pointsOptionPattern = /(^[ \t]*)<option value="points">Points<\/option>/gm;
          const matches = [...text.matchAll(pointsOptionPattern)];
          if(matches.length === expected){
            return text.replace(
              pointsOptionPattern,
              (whole, indent) => `${whole}\n${indent}<option value="rating">Rating</option>`
            );
          }
        }

        throw new Error(`${label}: expected ${expected} matches, found ${count}`);
      }

      function decodeSimplePythonString(value){
        return value
          .replace(/\\n/g, '\n')
          .replace(/\\r/g, '\r')
          .replace(/\\t/g, '\t')
          .replace(/\\"/g, '"')
          .replace(/\\\\/g, '\\');
      }

      let [html, patchScript] = await Promise.all([
        fetchFirst(appSources, 'the app source'),
        fetchFirst(patchSources, 'the rating update')
      ]);

      let tripleCalls = 0;
      let replaceNCalls = 0;
      const triplePattern = /replace_(once|n)\(\s*\n\s*"""([\s\S]*?)""",\s*\n\s*"""([\s\S]*?)""",\s*\n(?:\s*(\d+),\s*\n)?\s*"([^"]+)",\s*\n\)/g;
      let match;
      while((match = triplePattern.exec(patchScript)) !== null){
        const kind = match[1];
        const oldText = match[2];
        const newText = match[3];
        const expected = match[4] ? Number(match[4]) : 1;
        const label = match[5];
        html = kind === 'n'
          ? applyEvery(html, oldText, newText, expected, label)
          : applyOnce(html, oldText, newText, label);
        tripleCalls += 1;
        if(kind === 'n') replaceNCalls += 1;
      }

      let inlineCalls = 0;
      const inlinePattern = /replace_once\("((?:\\.|[^"\\])*)",\s*"((?:\\.|[^"\\])*)",\s*"([^"]+)"\)/g;
      while((match = inlinePattern.exec(patchScript)) !== null){
        html = applyOnce(
          html,
          decodeSimplePythonString(match[1]),
          decodeSimplePythonString(match[2]),
          match[3]
        );
        inlineCalls += 1;
      }

      if(tripleCalls !== 30 || replaceNCalls !== 1 || inlineCalls !== 1){
        throw new Error(`Rating patch was incomplete (triple=${tripleCalls}, multi=${replaceNCalls}, inline=${inlineCalls}).`);
      }

      html = applyOnce(
        html,
        `        rating: clampRating(sourceItem.rating),
        points: computePoints(sourceItem.wins,sourceItem.losses,sourceItem.tourneyBonus||0),`,
        `        rating: clampRating(sourceItem.rating),
        ratingSeededFromWinPctV1: !!sourceItem.ratingSeededFromWinPctV1,
        points: computePoints(sourceItem.wins,sourceItem.losses,sourceItem.tourneyBonus||0),`,
        'export one-time rating marker'
      );

      html = applyOnce(
        html,
        `          rating: incoming.rating != null
            ? clampRating(incoming.rating)
            : clampRating(existing.rating),

          // Keep image blobs as-is`,
        `          rating: incoming.rating != null
            ? clampRating(incoming.rating)
            : clampRating(existing.rating),

          ratingSeededFromWinPctV1: incoming.ratingSeededFromWinPctV1 != null
            ? !!incoming.ratingSeededFromWinPctV1
            : !!existing.ratingSeededFromWinPctV1,

          // Keep image blobs as-is`,
        'import one-time rating marker into database'
      );

      html = applyOnce(
        html,
        `          rating: incoming.rating != null
            ? clampRating(incoming.rating)
            : clampRating(existing.rating)
        };`,
        `          rating: incoming.rating != null
            ? clampRating(incoming.rating)
            : clampRating(existing.rating),

          ratingSeededFromWinPctV1: incoming.ratingSeededFromWinPctV1 != null
            ? !!incoming.ratingSeededFromWinPctV1
            : !!existing.ratingSeededFromWinPctV1
        };`,
        'import one-time rating marker into state'
      );

      html = applyOnce(
        html,
        `      async function handleReplaceImageFile(file, item){`,
        `      const ratingWinPctSeedRef = useRef(false);
      useEffect(()=>{
        if(ratingWinPctSeedRef.current || !libraryFullyLoaded || !items.length) return;

        const seedKey = 'ratingWinPctSeedV1Complete';
        let localSeedComplete = false;
        try{
          localSeedComplete = !!safeLocalStorage && safeLocalStorage.getItem(seedKey) === '1';
        }catch(err){}

        const librarySeedComplete = items.some(it => it.ratingSeededFromWinPctV1 === true);
        if(localSeedComplete || librarySeedComplete){
          ratingWinPctSeedRef.current = true;
          if(librarySeedComplete && !localSeedComplete && safeLocalStorage){
            try{ safeLocalStorage.setItem(seedKey, '1'); }catch(err){}
          }
          return;
        }

        ratingWinPctSeedRef.current = true;
        (async()=>{
          const seededItems = items.map(it=>{
            const wins = Math.max(0, Number(it.wins || 0));
            const losses = Math.max(0, Number(it.losses || 0));
            const total = wins + losses;
            const seededRating = total > 0
              ? Math.floor((wins / total) * 100)
              : 0;

            return {
              ...it,
              rating: clampRating(seededRating),
              ratingSeededFromWinPctV1: true
            };
          });

          await idbBulkPutMerged(seededItems);
          setItems(seededItems.map(slimItemForState));

          if(safeLocalStorage){
            try{ safeLocalStorage.setItem(seedKey, '1'); }catch(err){}
          }
        })().catch(err=>{
          ratingWinPctSeedRef.current = false;
          console.error('One-time rating initialization failed', err);
        });
      },[libraryFullyLoaded,items]);

      async function handleReplaceImageFile(file, item){`,
        'add one-time win percentage rating initialization'
      );

      const required = [
        'function clampRating(value)',
        'rating: 0,',
        'Rating (0-100)',
        'rating: clampRating(sourceItem.rating)',
        'rating: incoming.rating != null',
        "changeStatsSort('rating')",
        "const seedKey = 'ratingWinPctSeedV1Complete'",
        'Math.floor((wins / total) * 100)',
        'ratingSeededFromWinPctV1: true'
      ];
      const missing = required.filter(snippet => !html.includes(snippet));
      if(missing.length){
        throw new Error(`Rating validation failed: ${missing.join(', ')}`);
      }

      const ratingSortOptions = countOccurrences(html, '<option value="rating">Rating</option>');
      if(ratingSortOptions !== 2){
        throw new Error(`Rating validation failed: expected 2 rating sort options, found ${ratingSortOptions}`);
      }

      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      console.error('ComfortOtter failed to load', error);
      const target = document.getElementById('loaderError');
      if(target){
        target.textContent = `ComfortOtter could not finish loading.\n\n${error && error.message ? error.message : error}\n\nReload the page to try again.`;
      }
    });
  </script>
</body>
</html>
