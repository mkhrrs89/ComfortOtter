<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModelMatchup — AI Image Rater</title>
  <meta name="theme-color" content="#050c0a" />
  <style>
    html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.loaderCard{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}.loaderTitle{font-size:18px;font-weight:700;margin-bottom:8px}.loaderDetail{color:#8fb0a1}.loaderError{white-space:pre-wrap;text-align:left;color:#ffb4be;margin-top:12px}
  </style>
</head>
<body>
  <div class="loader"><div class="loaderCard"><div class="loaderTitle">Loading ComfortOtter…</div><div class="loaderDetail">Preparing your image library.</div><div id="loaderError" class="loaderError"></div></div></div>
  <script>
    (async function loadFirestoreSyncedComfortOtter(){
      const priorRevision='6131aebbe099bf09fd3944ec0a780f06941e7a8d';
      const urls=[
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@'+priorRevision+'/index.html',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/'+priorRevision+'/index.html'
      ];
      async function fetchFirst(){let last=null;for(const url of urls){try{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return await r.text();}catch(e){last=e;}}throw last||new Error('Could not load ComfortOtter code.');}
      let source=await fetchFirst();
      const marker="      wrapper = wrapper.replace(marker,durablePatch + '\\n' + marker);";
      if(source.split(marker).length-1!==1) throw new Error('Firestore stat-sync patch point not found exactly once.');
      const replacement=`      durablePatch += String.raw\`
      const cloudSyncNL = String.fromCharCode(10);
      const durableRowsMarker = '    function durableStatsRows(){ return Object.values(durableStatsReadMap()).filter(row=>row && row.id); }';
      if(html.split(durableRowsMarker).length - 1 !== 1) throw new Error('Firestore queue durable-row marker not found exactly once.');
      const cloudQueueHelpers = [
        durableRowsMarker,
        "    const CLOUD_STATS_QUEUE_KEY = 'modelMatchupPendingFirestoreStatsV1';",
        '    let cloudStatsFlushTimer = null;',
        '    let cloudStatsFlushRunning = false;',
        '',
        '    window.getAuthoritativeLocalStatsForCloud = function(id){',
        '      const row = id ? durableStatsReadMap()[id] : null;',
        '      return row ? {...row} : null;',
        '    };',
        '',
        '    function readCloudStatsQueue(){',
        "      try{ const storage=window.localStorage; const raw=storage?storage.getItem(CLOUD_STATS_QUEUE_KEY):null; const parsed=raw?JSON.parse(raw):{}; return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{}; }catch(err){ return {}; }",
        '    }',
        '    function writeCloudStatsQueue(queue){',
        "      try{ const storage=window.localStorage; if(!storage)return false; storage.setItem(CLOUD_STATS_QUEUE_KEY,JSON.stringify(queue||{})); return true; }catch(err){ console.warn('Firestore stats queue write failed',err); return false; }",
        '    }',
        '    function queueFirestoreStatPatch(id,patch){',
        '      if(!id||!patch)return;',
        '      const queue=readCloudStatsQueue();',
        "      const existing=queue[id]&&typeof queue[id]==='object'?queue[id]:{id:id};",
        '      const next={...existing,id:id};',
        '      let changed=false;',
        '      for(const key of DURABLE_STATS_KEYS){ if(Object.prototype.hasOwnProperty.call(patch,key)&&patch[key]!==undefined){ next[key]=normalizeDurableStat(key,patch[key]); changed=true; } }',
        '      if(!changed)return;',
        '      next.queuedAt=Date.now();',
        '      queue[id]=next;',
        '      writeCloudStatsQueue(queue);',
        '      scheduleFirestoreStatsFlush(50);',
        '    }',
        '    function scheduleFirestoreStatsFlush(delayMs){',
        '      if(cloudStatsFlushTimer||cloudStatsFlushRunning)return;',
        '      cloudStatsFlushTimer=setTimeout(()=>{ cloudStatsFlushTimer=null; flushFirestoreStatsQueue().catch(err=>console.warn(\\'Firestore stats flush failed\\',err)); },Math.max(0,Number(delayMs||0)));',
        '    }',
        '    async function flushFirestoreStatsQueue(){',
        '      if(cloudStatsFlushRunning)return;',
        '      const queue=readCloudStatsQueue();',
        '      const ids=Object.keys(queue);',
        '      if(!ids.length)return;',
        "      if(typeof window.saveItemToCloud!=='function'){ scheduleFirestoreStatsFlush(1000); return; }",
        '      cloudStatsFlushRunning=true;',
        '      let hadFailure=false;',
        '      try{',
        '        for(const id of ids.slice(0,24)){',
        '          const currentQueue=readCloudStatsQueue();',
        '          const snapshot=currentQueue[id];',
        '          if(!snapshot)continue;',
        '          let ok=false;',
        '          try{ ok=(await window.saveItemToCloud(snapshot))===true; }catch(err){ console.warn(\\'Firestore stat update failed\\',id,err); }',
        '          const latest=readCloudStatsQueue();',
        '          if(ok&&latest[id]&&latest[id].queuedAt===snapshot.queuedAt){ delete latest[id]; writeCloudStatsQueue(latest); }',
        '          else if(!ok){ hadFailure=true; }',
        '        }',
        '      }finally{',
        '        cloudStatsFlushRunning=false;',
        '        if(Object.keys(readCloudStatsQueue()).length) scheduleFirestoreStatsFlush(hadFailure?5000:100);',
        '      }',
        '    }',
        "    window.addEventListener('online',()=>scheduleFirestoreStatsFlush(0));",
        "    window.addEventListener('pageshow',()=>scheduleFirestoreStatsFlush(250));",
        '    setTimeout(()=>scheduleFirestoreStatsFlush(500),500);'
      ].join(cloudSyncNL);
      html=html.replace(durableRowsMarker,cloudQueueHelpers);

      const cloudSaveStart = '  async function saveItemToCloud(item) {' + cloudSyncNL + '    const meta = stripBigFields(item);';
      const cloudSaveNew = [
        '  async function saveItemToCloud(item) {',
        "    const authoritative = item && item.id && window.getAuthoritativeLocalStatsForCloud ? window.getAuthoritativeLocalStatsForCloud(item.id) : null;",
        '    const sourceItem = authoritative ? {...item,...authoritative} : item;',
        '    const meta = stripBigFields(sourceItem);'
      ].join(cloudSyncNL);
      if(html.split(cloudSaveStart).length - 1 !== 1) throw new Error('Firestore cloud-save overlay patch point not found exactly once.');
      html=html.replace(cloudSaveStart,cloudSaveNew);

      const cloudSuccess = '      await setDoc(ref, meta, { merge: true });' + cloudSyncNL + '      // console.log(\"☁️ mirrored to Firestore\", meta.id);';
      const cloudSuccessNew = '      await setDoc(ref, meta, { merge: true });' + cloudSyncNL + '      // console.log(\"☁️ mirrored to Firestore\", meta.id);' + cloudSyncNL + '      return true;';
      if(html.split(cloudSuccess).length - 1 !== 1) throw new Error('Firestore cloud-save success patch point not found exactly once.');
      html=html.replace(cloudSuccess,cloudSuccessNew);
      const cloudFailure = '      // don\\'t throw – local save should still succeed' + cloudSyncNL + '    }' + cloudSyncNL + '  }';
      const cloudFailureNew = '      // don\\'t throw – local save should still succeed' + cloudSyncNL + '      return false;' + cloudSyncNL + '    }' + cloudSyncNL + '  }';
      if(html.split(cloudFailure).length - 1 !== 1) throw new Error('Firestore cloud-save failure patch point not found exactly once.');
      html=html.replace(cloudFailure,cloudFailureNew);

      const persistOld = [
        '    async function persistStatPatch(id,patch){',
        '      const row = durableStatsPatch(id,patch);',
        '      if(!row) return;',
        "      try{ await fastStatsPutItems([{id:id,...patch}]); }catch(err){ console.warn('Lightweight stat write failed; durable journal kept the result.',err); }",
        '    }'
      ].join(cloudSyncNL);
      const persistNew = [
        '    async function persistStatPatch(id,patch){',
        '      const row = durableStatsPatch(id,patch);',
        '      if(!row) return;',
        '      queueFirestoreStatPatch(id,row);',
        "      try{ await fastStatsPutItems([{id:id,...patch}]); }catch(err){ console.warn('Lightweight stat write failed; durable journal kept the result.',err); }",
        '    }'
      ].join(cloudSyncNL);
      if(html.split(persistOld).length - 1 !== 1) throw new Error('Firestore persistStatPatch point not found exactly once.');
      html=html.replace(persistOld,persistNew);
\`;
      wrapper = wrapper.replace(marker,durablePatch + '\\n' + marker);`;
      source=source.replace(marker,replacement);
      document.open();document.write(source);document.close();
    })().catch(error=>{
      console.error('ComfortOtter Firestore-sync loader failed',error);
      const target=document.getElementById('loaderError');
      if(target) target.textContent='ComfortOtter could not finish loading.\n\n'+(error&&error.message?error.message:error)+'\n\nReload the page to try again.';
    });
  </script>
</body>
</html>
