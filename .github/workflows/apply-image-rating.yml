name: Apply image rating update

on:
  push:
    branches:
      - agent/add-image-rating
    paths:
      - .github/workflows/apply-image-rating.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-image-rating
          fetch-depth: 0

      - name: Apply focused patch
        run: python .github/scripts/add_image_rating.py

      - name: Validate result
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'rating helper': 'function clampRating(value)',
              'new image default': 'rating: 0,',
              'editable field': 'Rating (0-100)',
              'metadata export': 'rating: clampRating(sourceItem.rating)',
              'metadata import': 'rating: incoming.rating != null',
              'stats column': "changeStatsSort('rating')",
          }
          missing = [name for name, snippet in checks.items() if snippet not in text]
          if missing:
              raise SystemExit('Missing validations: ' + ', '.join(missing))
          print('Validation passed')
          PY

      - name: Commit final app change
        run: |
          rm -f .github/scripts/add_image_rating.py .github/workflows/apply-image-rating.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 0-100 image ratings"
          git push origin HEAD:agent/add-image-rating
