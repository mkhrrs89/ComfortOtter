<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModelMatchup → Firebase Migration</title>
  <link rel="stylesheet" href="app-style.css">
  <style>
    html,body{height:100%;margin:0;background:#050510;color:#f5f5f5;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:560px;padding:20px;border:1px solid #123427;border-radius:14px;background:#020617}.muted{color:#8fb0a1}.err{white-space:pre-wrap;color:#ffb4be;margin-top:12px}
  </style>
</head>
<body>
  <div class="loader"><div class="card"><div style="font-size:18px;font-weight:700">Loading Firebase Migration…</div><div class="muted">Preparing migration tools.</div><div id="err" class="err"></div></div></div>
  <script>
    (async function loadStatsSafeMigration(){
      const priorRevision='cc5a0dfd1bfc936a2bf865eab3e877748e9a9ac5';
      const urls=[
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@'+priorRevision+'/migrate.html',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/'+priorRevision+'/migrate.html'
      ];
      async function fetchFirst(){let last=null;for(const url of urls){try{const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return await r.text();}catch(e){last=e;}}throw last||new Error('Could not load migration tool.');}
      let source=await fetchFirst();
      const receiptMarker='    const RECEIPT_FALLBACK_KEY = "modelMatchupMigrationReceiptsV1";';
      if(source.split(receiptMarker).length-1!==1) throw new Error('Migration durable-stats helper patch point not found exactly once.');
      const helper=`${receiptMarker}
    const DURABLE_STATS_STORAGE_KEY = "modelMatchupDurableStatsV1";
    const DURABLE_STAT_KEYS = ["wins","losses","tourneyBonus","tourneyCount","rating","ratingSeededFromWinPctV1"];

    function readDurableStatsForMigration(id){
      if(!id) return {};
      try{
        const raw=localStorage.getItem(DURABLE_STATS_STORAGE_KEY);
        const parsed=raw?JSON.parse(raw):{};
        const row=parsed&&typeof parsed==="object"?parsed[id]:null;
        if(!row||typeof row!=="object") return {};
        const out={};
        for(const key of DURABLE_STAT_KEYS){ if(row[key]!==undefined) out[key]=row[key]; }
        return out;
      }catch(err){
        console.warn("Could not read durable stats for migration",err);
        return {};
      }
    }`;
      source=source.replace(receiptMarker,helper);
      const metaMarker='        ...stripBigFields(item),';
      if(source.split(metaMarker).length-1!==1) throw new Error('Migration metadata stat overlay patch point not found exactly once.');
      source=source.replace(metaMarker,'        ...stripBigFields({...item,...readDurableStatsForMigration(item.id)}),');
      document.open();document.write(source);document.close();
    })().catch(error=>{
      console.error('Stats-safe migration loader failed',error);
      const target=document.getElementById('err');
      if(target) target.textContent='Migration tool could not finish loading.\n\n'+(error&&error.message?error.message:error)+'\n\nReload the page to try again.';
    });
  </script>
</body>
</html>
