<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ModelMatchup → Firebase Migration</title>
  <link rel="stylesheet" href="app-style.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050510;
      color: #f5f5f5;
      padding: 2.5rem 2rem;
      font-size: 24px;
      line-height: 1.75;
    }
    h1 {
      margin-bottom: 0.75rem;
      font-size: 2.6rem;
    }
    button {
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 600;
      margin-right: 0.9rem;
    }
    #migrateBtn {
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #020617;
      box-shadow: 0 8px 18px rgba(20, 184, 166, 0.35);
    }
    #migrateBtn[disabled] { opacity: 0.55; cursor: default; }
    #status {
      margin-top: 1.1rem;
      font-size: 1.2rem;
      font-weight: 500;
    }
    #log {
      margin-top: 1.25rem;
      padding: 1.25rem;
      background: #020617;
      border-radius: 0.9rem;
      max-height: 60vh;
      overflow: auto;
      font-size: 1.1rem;
      white-space: pre-wrap;
      border: 1px solid #123427;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .tab {
      background: #0b1224;
      color: #f5f5f5;
      border: 1px solid #123427;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 1.05rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      min-height: 44px;
    }
    .tab.active {
      outline: 2px solid #16a085;
      background: linear-gradient(135deg, #1f9d73, #157457);
      box-shadow: 0 8px 18px rgba(22, 160, 133, 0.35);
    }
    @media (max-width: 600px) {
      body {
        padding: 2.75rem 1.6rem;
        font-size: 20px;
        line-height: 1.75;
      }
      h1 { font-size: 2.4rem; }
      .pageHeader p { font-size: 1.15rem; }
      button {
        width: 100%;
        margin-right: 0;
        margin-bottom: 1rem;
        font-size: 1.15rem;
        padding: 1rem 1.8rem;
      }
      #status {
        display: block;
        margin-top: 0.5rem;
        font-size: 1.1rem;
      }
      .toolbar { gap: 14px; }
      .tab {
        font-size: 1rem;
        padding: 12px 16px;
        min-height: 52px;
      }
      .navTrigger {
        font-size: 1rem;
        padding: 10px 16px;
      }
      .navMenuList { min-width: 220px; }
      .navItem {
        font-size: 1rem;
        padding: 10px 12px;
      }
      #log {
        font-size: 1rem;
        padding: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <header class="pageHeader">
    <div>
      <h1>ModelMatchup → Firebase Migration</h1>
      <p>This tool uploads any items that still have <code>dataUrl</code> and no <code>fullUrl</code> into Firebase Storage + Firestore.</p>
    </div>
    <div class="navMenuShell">
      <details class="navDropdown">
        <summary class="navTrigger">Menu ▾</summary>
        <div class="navMenuList">
          <a class="navItem" href="index.html?tab=Library">Library</a>
          <a class="navItem" href="index.html?tab=Matchups">Matchups</a>
          <a class="navItem" href="index.html?tab=Stats">Stats</a>
          <a class="navItem" href="index.html?tab=Collections">Collections</a>
          <div class="navSpacer"></div>
          <a class="navItem" href="tourney.html">Tournament</a>
          <a class="navItem" href="settings.html">Settings</a>
        </div>
      </details>
    </div>
  </header>

  <div class="toolbar">
    <a href="index.html" class="tab">← Back to Library</a>
    <a href="sizes.html" class="tab">Image Sizes</a>
    <a href="duplicates.html" class="tab">Title Twins</a>
    <a href="normalize-urls.html" class="tab">Normalize URLs</a>
    <a href="unmigrated-report.html" class="tab">Unmigrated Report</a>
    <a href="migrate.html" class="tab active">Firebase Migration</a>
  </div>

  <button id="migrateBtn">Migrate unmigrated items</button>
  <span id="status"></span>
  <pre id="log"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOVGz7QH_iPtxoM25baGqTIR-2yxUQwH8",
      authDomain: "comforting-otter.firebaseapp.com",
      projectId: "comforting-otter",
      storageBucket: "comforting-otter.firebasestorage.app",
      messagingSenderId: "1074346290690",
      appId: "1:1074346290690:web:bd2721e73fbdf029e7411b",
      measurementId: "G-2JT31JFGNJ"
    };

    const app     = initializeApp(firebaseConfig);
    const auth    = getAuth(app);
    const db      = getFirestore(app);
    const storage = getStorage(app);

    const DB_NAME  = "modelMatchupDB";
    const DB_STORE = "items";
    const FIREBASE_STEP_TIMEOUT_MS = 45000;
    const LOCAL_WRITE_TIMEOUT_MS = 60000;
    const UPLOAD_STALL_TIMEOUT_MS = 60000;
    const UPLOAD_OVERALL_TIMEOUT_MS = 180000;

    let dbPromise = null;
    let liveDb = null;
    let migrationRunning = false;

    const statusEl = document.getElementById("status");
    const logEl    = document.getElementById("log");
    const btn      = document.getElementById("migrateBtn");

    function setStatus(text){ statusEl.textContent = text; }

    function log(text){
      const ts = new Date().toISOString().slice(11, 19);
      logEl.textContent += `[${ts}] ${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function delay(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function withTimeout(promise, ms, label){
      return new Promise((resolve, reject) => {
        let settled = false;
        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error(`${label} timed out after ${Math.round(ms / 1000)} seconds.`));
        }, ms);
        Promise.resolve(promise).then(
          value => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve(value);
          },
          err => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            reject(err);
          }
        );
      });
    }

    async function retryAsync(label, task, attempts = 2){
      let lastError = null;
      for (let attempt = 1; attempt <= attempts; attempt++) {
        try {
          return await task(attempt);
        } catch (err) {
          lastError = err;
          if (attempt >= attempts) break;
          log(`${label} failed once; retrying…`);
          await delay(600);
        }
      }
      throw lastError || new Error(`${label} failed.`);
    }

    function formatBytes(bytes){
      const n = Number(bytes || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / (1024 * 1024)).toFixed(1)} MB`;
    }

    function closeDb(){
      if (liveDb) {
        try { liveDb.close(); } catch {}
      }
      liveDb = null;
      dbPromise = null;
    }

    function openDbAttempt(timeoutMs){
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
          reject(new Error('IndexedDB is unavailable in this browser.'));
          return;
        }

        let settled = false;
        let req;
        try {
          req = indexedDB.open(DB_NAME);
        } catch (err) {
          reject(err);
          return;
        }

        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error(`Timed out opening IndexedDB after ${timeoutMs}ms.`));
        }, timeoutMs);

        const finish = fn => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          fn();
        };

        req.onblocked = () => finish(() => reject(new Error('IndexedDB open was blocked by another page.')));
        req.onerror = () => finish(() => reject(req.error || new Error('Failed to open IndexedDB.')));
        req.onsuccess = () => {
          const opened = req.result;
          if (settled) {
            try { opened.close(); } catch {}
            return;
          }
          if (!opened.objectStoreNames.contains(DB_STORE)) {
            try { opened.close(); } catch {}
            finish(() => reject(new Error(`IndexedDB is missing the ${DB_STORE} store.`)));
            return;
          }
          opened.onversionchange = () => {
            try { opened.close(); } catch {}
            if (liveDb === opened) {
              liveDb = null;
              dbPromise = null;
            }
          };
          liveDb = opened;
          finish(() => resolve(opened));
        };
      });
    }

    async function openDB(){
      if (liveDb) return liveDb;
      if (dbPromise) return dbPromise;

      dbPromise = (async () => {
        const timeouts = [12000, 20000, 30000];
        let lastError = null;
        for (let i = 0; i < timeouts.length; i++) {
          try {
            return await openDbAttempt(timeouts[i]);
          } catch (err) {
            lastError = err;
            console.warn(`IndexedDB open attempt ${i + 1} failed`, err);
            if (i < timeouts.length - 1) await delay(400 * (i + 1));
          }
        }
        throw lastError || new Error('Could not open IndexedDB.');
      })().catch(err => {
        dbPromise = null;
        throw err;
      });

      return dbPromise;
    }

    function isRetriableDbError(err){
      const name = err && err.name ? String(err.name) : '';
      const msg = String(err && err.message ? err.message : err || '').toLowerCase();
      return name === 'AbortError' ||
        name === 'InvalidStateError' ||
        name === 'TransactionInactiveError' ||
        msg.includes('timed out') ||
        msg.includes('abort') ||
        msg.includes('closed');
    }

    async function idbPut(item){
      let attempt = 0;
      while (true) {
        attempt += 1;
        try {
          const localDb = await openDB();
          return await new Promise((resolve, reject) => {
            let settled = false;
            let tx;
            let timer;

            const finish = fn => {
              if (settled) return;
              settled = true;
              if (timer) clearTimeout(timer);
              fn();
            };

            try {
              tx = localDb.transaction(DB_STORE, "readwrite");
              tx.objectStore(DB_STORE).put(item);
            } catch (err) {
              finish(() => reject(err));
              return;
            }

            timer = setTimeout(() => {
              try { tx.abort(); } catch {}
              finish(() => reject(new Error('Local IndexedDB write timed out.')));
            }, LOCAL_WRITE_TIMEOUT_MS);

            tx.oncomplete = () => finish(resolve);
            tx.onerror = () => finish(() => reject(tx.error || new Error('IndexedDB write failed.')));
            tx.onabort = () => finish(() => reject(tx.error || new Error('IndexedDB write aborted.')));
          });
        } catch (err) {
          if (attempt >= 2 || !isRetriableDbError(err)) throw err;
          closeDb();
          await delay(350);
        }
      }
    }

    async function collectUnmigrated(){
      const localDb = await openDB();
      return new Promise((resolve, reject) => {
        let tx;
        try {
          tx = localDb.transaction(DB_STORE, "readonly");
        } catch (err) {
          reject(err);
          return;
        }
        const store = tx.objectStore(DB_STORE);
        const itemsToMigrate = [];
        const req = store.openCursor();

        req.onsuccess = e => {
          const cursor = e.target.result;
          if (!cursor) return;
          const item = cursor.value;
          if (item && item.dataUrl && !item.fullUrl) itemsToMigrate.push(item);
          cursor.continue();
        };
        req.onerror = () => reject(req.error || new Error('Failed reading local image records.'));
        tx.oncomplete = () => resolve(itemsToMigrate);
        tx.onerror = () => reject(tx.error || new Error('IndexedDB read transaction failed.'));
        tx.onabort = () => reject(tx.error || new Error('IndexedDB read transaction aborted.'));
      });
    }

    function dataUrlToBlob(dataUrl){
      if (typeof dataUrl !== 'string' || !dataUrl.startsWith('data:')) {
        throw new Error('Local image data is not a valid data URL.');
      }
      const comma = dataUrl.indexOf(',');
      if (comma < 0) throw new Error('Local image data URL is malformed.');

      const header = dataUrl.slice(0, comma);
      const body = dataUrl.slice(comma + 1);
      const mimeMatch = /^data:([^;,]+)/i.exec(header);
      const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
      const isBase64 = /;base64/i.test(header);

      if (!isBase64) {
        return new Blob([decodeURIComponent(body)], { type: mime });
      }

      const binary = atob(body);
      const chunkSize = 1024 * 512;
      const chunks = [];
      for (let offset = 0; offset < binary.length; offset += chunkSize) {
        const end = Math.min(offset + chunkSize, binary.length);
        const bytes = new Uint8Array(end - offset);
        for (let i = offset; i < end; i++) bytes[i - offset] = binary.charCodeAt(i);
        chunks.push(bytes);
      }
      return new Blob(chunks, { type: mime });
    }

    function stripBigFields(item){
      const { dataUrl, thumbnail, thumbDataUrl, ...rest } = item || {};
      return rest || {};
    }

    async function ensureFirebaseAuth(){
      if (auth.currentUser) return auth.currentUser;
      setStatus('Signing into Firebase…');
      log('Signing into Firebase…');
      const credential = await withTimeout(
        signInAnonymously(auth),
        20000,
        'Firebase sign-in'
      );
      log('Firebase sign-in ready.');
      return credential.user;
    }

    function uploadBlobWithProgress(storageRef, blob, itemIndex, totalItems){
      return new Promise((resolve, reject) => {
        const task = uploadBytesResumable(storageRef, blob);
        let settled = false;
        let lastProgressAt = Date.now();
        let lastLoggedBucket = -1;
        const startedAt = Date.now();

        const cleanup = () => {
          clearInterval(watchdog);
        };

        const finish = fn => {
          if (settled) return;
          settled = true;
          cleanup();
          fn();
        };

        const watchdog = setInterval(() => {
          const now = Date.now();
          if (now - lastProgressAt > UPLOAD_STALL_TIMEOUT_MS || now - startedAt > UPLOAD_OVERALL_TIMEOUT_MS) {
            try { task.cancel(); } catch {}
            finish(() => reject(new Error('Firebase Storage upload stalled or timed out.')));
          }
        }, 3000);

        task.on('state_changed', snapshot => {
          lastProgressAt = Date.now();
          const total = Number(snapshot.totalBytes || blob.size || 0);
          const transferred = Number(snapshot.bytesTransferred || 0);
          const pct = total > 0 ? Math.floor((transferred / total) * 100) : 0;
          setStatus(`Uploading ${itemIndex} of ${totalItems}… ${pct}%`);
          const bucket = Math.floor(pct / 25);
          if (bucket > lastLoggedBucket && pct > 0) {
            lastLoggedBucket = bucket;
            log(`Upload ${itemIndex}/${totalItems}: ${pct}%`);
          }
        }, err => {
          finish(() => reject(err));
        }, () => {
          finish(() => resolve(task.snapshot));
        });
      });
    }

    async function migrateItem(item, index, total){
      if (!item || !item.id) return "skip";
      if (!item.dataUrl) return "skip";
      if (item.fullUrl) return "skipAlready";

      setStatus(`Preparing ${index} of ${total}…`);
      log(`Starting ${index}/${total}: ${item.id}`);

      let blob;
      try {
        blob = dataUrlToBlob(item.dataUrl);
      } catch (err) {
        throw new Error(`Could not prepare local image: ${err.message || err}`);
      }
      log(`Prepared ${item.id} (${formatBytes(blob.size)}).`);

      const path = `images/${item.id}.jpg`;
      const storageRef = ref(storage, path);

      setStatus(`Uploading ${index} of ${total}…`);
      log(`Uploading ${item.id} to Firebase Storage…`);
      const snap = await retryAsync('Storage upload', () =>
        uploadBlobWithProgress(storageRef, blob, index, total)
      );
      log(`Storage upload complete for ${item.id}.`);

      setStatus(`Getting URL ${index} of ${total}…`);
      const fullUrl = await retryAsync('Download URL lookup', () =>
        withTimeout(getDownloadURL(snap.ref), FIREBASE_STEP_TIMEOUT_MS, 'Getting Firebase download URL')
      );

      const meta = {
        ...stripBigFields(item),
        fullUrl,
        updatedAt: new Date().toISOString()
      };

      setStatus(`Saving metadata ${index} of ${total}…`);
      log(`Saving Firestore metadata for ${item.id}…`);
      await retryAsync('Firestore metadata save', () =>
        withTimeout(
          setDoc(doc(db, "images", item.id), meta, { merge: true }),
          FIREBASE_STEP_TIMEOUT_MS,
          'Saving Firestore metadata'
        )
      );
      log(`Firestore metadata saved for ${item.id}.`);

      setStatus(`Updating local record ${index} of ${total}…`);
      log(`Updating local fullUrl for ${item.id}…`);
      item.fullUrl = fullUrl;
      await idbPut(item);
      log(`Local record updated for ${item.id}.`);

      return "migrated";
    }

    async function migrateAll(){
      if (migrationRunning) return;
      migrationRunning = true;
      btn.disabled = true;
      setStatus("Starting migration…");
      log("Opening IndexedDB…");

      try {
        let items;
        try {
          items = await collectUnmigrated();
        } catch (err) {
          console.error('Could not open/read local IndexedDB', err);
          const detail = err && err.message ? err.message : String(err);
          throw new Error(`Could not open local IndexedDB: ${detail}`);
        }

        log(`Found ${items.length} items that still need migration.`);
        if (!items.length) {
          setStatus('Done. Nothing needs migration.');
          log('Migration complete.');
          return;
        }

        await ensureFirebaseAuth();

        let migrated = 0;
        let skipped = 0;
        let failed = 0;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          try {
            const result = await migrateItem(item, i + 1, items.length);
            if (result === "migrated") {
              migrated++;
              log(`Migrated ${item.id} (${i + 1}/${items.length}).`);
            } else {
              skipped++;
              log(`Skipped ${item && item.id ? item.id : 'unknown item'} (${i + 1}/${items.length}).`);
            }
          } catch (err) {
            failed++;
            const sr = (err && typeof err.serverResponse === 'string') ? err.serverResponse : '';
            const cd = (err && err.customData) ? JSON.stringify(err.customData) : '';
            let errJson = '';
            try { errJson = JSON.stringify(err); } catch { errJson = String(err); }
            log(`ERROR for ${item.id}: ${err?.message || err} (${err?.code || 'no-code'})`);
            if (sr) log(`serverResponse: ${sr}`);
            if (cd) log(`customData: ${cd}`);
            if (errJson && errJson !== '{}') log(`errorJson: ${errJson}`);
            console.error('Firebase migration error', err);
          }

          setStatus(`Processed ${i + 1} of ${items.length}…`);
          await delay(75);
        }

        setStatus(`Done. Migrated ${migrated}, skipped ${skipped}, failed ${failed}.`);
        log(`Migration complete. Migrated ${migrated}, skipped ${skipped}, failed ${failed}.`);
      } catch (err) {
        setStatus('Migration could not finish.');
        log("Unexpected error: " + (err.message || err));
        console.error('Migration could not finish', err);
      } finally {
        migrationRunning = false;
        btn.disabled = false;
      }
    }

    window.addEventListener('pagehide', closeDb);
    btn.addEventListener("click", migrateAll);
  </script>
</body>
</html>
