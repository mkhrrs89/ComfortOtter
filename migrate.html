<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050510;

    button {
      padding: 0.85rem 1.6rem;
      border-radius: 999px;

      margin-right: 0.9rem;
    }
    #migrateBtn {
      background: linear-gradient(135deg, #14b8a6, #0f766e);
      color: #020617;
      box-shadow: 0 8px 18px rgba(20, 184, 166, 0.35);
    }
    #status {
      margin-top: 1.1rem;

    }
    #log {
      margin-top: 1.25rem;
      padding: 1.25rem;
      background: #020617;
      border-radius: 0.9rem;
      max-height: 60vh;
      overflow: auto;
      font-size: 1.1rem;
      white-space: pre-wrap;
      border: 1px solid #123427;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

    .toolbar {

      align-items: center;

    }
    .tab.active {
      outline: 2px solid #16a085;
      background: linear-gradient(135deg, #1f9d73, #157457);
      box-shadow: 0 8px 18px rgba(22, 160, 133, 0.35);
    }
    @media (max-width: 600px) {
      body {
        padding: 2.75rem 1.6rem;
        font-size: 20px;
        line-height: 1.75;
      }
      h1 { font-size: 2.4rem; }
      .pageHeader p { font-size: 1.15rem; }
      button {
        width: 100%;
        margin-right: 0;
        margin-bottom: 1rem;
        font-size: 1.15rem;
        padding: 1rem 1.8rem;
      }
      #status {
        display: block;
        margin-top: 0.5rem;
        font-size: 1.1rem;
      }
      .toolbar { gap: 14px; }
      .tab {
        font-size: 1rem;
        padding: 12px 16px;
        min-height: 52px;
      }
      .navTrigger {
        font-size: 1rem;
        padding: 10px 16px;
      }
      .navMenuList { min-width: 220px; }
      .navItem {
        font-size: 1rem;

      }

      }
    }
  </style>
</head>
<body>
  <header class="pageHeader">
    <div>
      <h1>ModelMatchup → Firebase Migration</h1>
      <p>This tool uploads any items that still have <code>dataUrl</code> and no <code>fullUrl</code> into Firebase Storage + Firestore.</p>
    </div>
    <div class="navMenuShell">
      <details class="navDropdown">
        <summary class="navTrigger">Menu ▾</summary>
        <div class="navMenuList">
          <a class="navItem" href="index.html?tab=Library">Library</a>
          <a class="navItem" href="index.html?tab=Matchups">Matchups</a>
          <a class="navItem" href="index.html?tab=Stats">Stats</a>
          <a class="navItem" href="index.html?tab=Collections">Collections</a>
          <div class="navSpacer"></div>
          <a class="navItem" href="tourney.html">Tournament</a>
          <a class="navItem" href="settings.html">Settings</a>
        </div>
      </details>
    </div>
  </header>

  <div class="toolbar">
    <a href="index.html" class="tab">← Back to Library</a>
    <a href="sizes.html" class="tab">Image Sizes</a>
    <a href="duplicates.html" class="tab">Title Twins</a>
    <a href="normalize-urls.html" class="tab">Normalize URLs</a>
    <a href="unmigrated-report.html" class="tab">Unmigrated Report</a>
    <a href="migrate.html" class="tab active">Firebase Migration</a>
  </div>

  <button id="migrateBtn">Migrate unmigrated items</button>
  <span id="status"></span>
  <pre id="log"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBOVGz7QH_iPtxoM25baGqTIR-2yxUQwH8",
      authDomain: "comforting-otter.firebaseapp.com",
      projectId: "comforting-otter",
      storageBucket: "comforting-otter.firebasestorage.app",
      messagingSenderId: "1074346290690",
      appId: "1:1074346290690:web:bd2721e73fbdf029e7411b",
      measurementId: "G-2JT31JFGNJ"
    };

    const app     = initializeApp(firebaseConfig);
    const auth    = getAuth(app);
    const db      = getFirestore(app);
    const storage = getStorage(app);

    signInAnonymously(auth).catch(console.error);

    const DB_NAME  = "modelMatchupDB";
    const DB_STORE = "items";
    let dbPromise = null;
    let liveDb = null;

    function delay(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function closeDb(){
      if (liveDb) {
        try { liveDb.close(); } catch {}
      }
      liveDb = null;
      dbPromise = null;
    }

    function openDbAttempt(timeoutMs){
      return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
          reject(new Error('IndexedDB is unavailable in this browser.'));
          return;
        }

        let settled = false;
        let req;
        try {
          // Open the database at its existing version. Avoiding a versioned
          // open prevents unnecessary version negotiation on iOS/WebKit.
          req = indexedDB.open(DB_NAME);
        } catch (err) {
          reject(err);
          return;
        }

        const timer = setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error(`Timed out opening IndexedDB after ${timeoutMs}ms.`));
        }, timeoutMs);

        const finish = (fn) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          fn();
        };

        req.onblocked = () => {
          finish(() => reject(new Error('IndexedDB open was blocked by another page.')));
        };

        req.onerror = () => {
          finish(() => reject(req.error || new Error('Failed to open IndexedDB.')));
        };

        req.onsuccess = () => {
          const opened = req.result;
          if (settled) {
            try { opened.close(); } catch {}
            return;
          }
          if (!opened.objectStoreNames.contains(DB_STORE)) {
            try { opened.close(); } catch {}
            finish(() => reject(new Error(`IndexedDB is missing the ${DB_STORE} store.`)));
            return;
          }
          opened.onversionchange = () => {
            try { opened.close(); } catch {}
            if (liveDb === opened) {
              liveDb = null;
              dbPromise = null;
            }
          };
          liveDb = opened;
          finish(() => resolve(opened));
        };
      });
    }

    async function openDB(){
      if (liveDb) return liveDb;
      if (dbPromise) return dbPromise;

      dbPromise = (async () => {
        const timeouts = [12000, 20000, 30000];
        let lastError = null;
        for (let i = 0; i < timeouts.length; i++) {
          try {
            return await openDbAttempt(timeouts[i]);
          } catch (err) {
            lastError = err;
            console.warn(`IndexedDB open attempt ${i + 1} failed`, err);
            if (i < timeouts.length - 1) await delay(400 * (i + 1));
          }
        }
        throw lastError || new Error('Could not open IndexedDB.');
      })().catch(err => {
        dbPromise = null;
        throw err;
      });

      return dbPromise;
    }

    function isRetriableDbError(err){
      const name = err && err.name ? String(err.name) : '';
      const msg = String(err && err.message ? err.message : err || '').toLowerCase();
      return name === 'AbortError' ||
        name === 'InvalidStateError' ||
        name === 'TransactionInactiveError' ||
        msg.includes('timed out') ||
        msg.includes('abort') ||
        msg.includes('closed');
    }

    async function idbPut(item){
      let attempt = 0;
      while (true) {
        attempt += 1;
        try {
          const localDb = await openDB();
          return await new Promise((resolve, reject) => {
            let tx;
            try {
              tx = localDb.transaction(DB_STORE, "readwrite");
              tx.objectStore(DB_STORE).put(item);
            } catch (err) {
              reject(err);
              return;
            }
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error || new Error('IndexedDB write failed.'));
            tx.onabort = () => reject(tx.error || new Error('IndexedDB write aborted.'));
          });
        } catch (err) {
          if (attempt >= 2 || !isRetriableDbError(err)) throw err;
          closeDb();
          await delay(350);
        }
      }
    }

    window.addEventListener('pagehide', closeDb);

    const statusEl = document.getElementById("status");
    const logEl    = document.getElementById("log");
    const btn      = document.getElementById("migrateBtn");

    function setStatus(text){ statusEl.textContent = text; }

    function log(text){
      const ts = new Date().toISOString().slice(11, 19);
      logEl.textContent += `[${ts}] ${text}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function stripBigFields(item){
      const { dataUrl, thumbnail, thumbDataUrl, ...rest } = item || {};
      return rest || {};
    }

    async function migrateItem(item){
      if (!item || !item.id) return "skip";
      if (!item.dataUrl) return "skip";
      if (item.fullUrl)  return "skipAlready";

      const res  = await fetch(item.dataUrl);
      const blob = await res.blob();

      const path       = `images/${item.id}.jpg`;
      const storageRef = ref(storage, path);

      const snap    = await uploadBytes(storageRef, blob);
      const fullUrl = await getDownloadURL(snap.ref);

      const meta = {
        ...stripBigFields(item),
        fullUrl,
        updatedAt: new Date().toISOString()
      };

      await setDoc(doc(db, "images", item.id), meta, { merge: true });

      item.fullUrl = fullUrl;
      await idbPut(item);

      return "migrated";
    }

    async function collectUnmigrated(){
      const localDb = await openDB();
      return new Promise((resolve, reject) => {
        let tx;
        try {
          tx = localDb.transaction(DB_STORE, "readonly");
        } catch (err) {
          reject(err);
          return;
        }
        const store = tx.objectStore(DB_STORE);
        const itemsToMigrate = [];
        const req = store.openCursor();

        req.onsuccess = e => {
          const cursor = e.target.result;
          if (!cursor) return;
          const item = cursor.value;
          if (item && item.dataUrl && !item.fullUrl) {
            itemsToMigrate.push(item);
          }
          cursor.continue();
        };
        req.onerror = () => reject(req.error || new Error('Failed reading local image records.'));
        tx.oncomplete = () => resolve(itemsToMigrate);
        tx.onerror = () => reject(tx.error || new Error('IndexedDB read transaction failed.'));
        tx.onabort = () => reject(tx.error || new Error('IndexedDB read transaction aborted.'));
      });
    }

    async function migrateAll(){
      btn.disabled = true;
      setStatus("Starting migration...");
      log("Opening IndexedDB…");

      let items;
      try {
        items = await collectUnmigrated();
      } catch (err) {
        console.error('Could not open/read local IndexedDB', err);
        const detail = err && err.message ? err.message : String(err);
        throw new Error(`Could not open local IndexedDB: ${detail}`);
      }

      log(`Found ${items.length} items that still need migration.`);

      let migrated = 0;
      let skipped  = 0;
      let failed   = 0;

      for (const item of items){
        try {
          const result = await migrateItem(item);
          if (result === "migrated") {
            migrated++;
            log(`Migrated ${item.id}`);
          } else {
            skipped++;
          }
        } catch (err){
          failed++;
          const sr = (err && typeof err.serverResponse === 'string') ? err.serverResponse : '';
          const cd = (err && err.customData) ? JSON.stringify(err.customData) : '';
          let errJson = '';
          try { errJson = JSON.stringify(err); } catch { errJson = String(err); }
          log(`ERROR for ${item.id}: ${err?.message || err} (${err?.code || 'no-code'})`);
          if (sr) log(`serverResponse: ${sr}`);
          if (cd) log(`customData: ${cd}`);
          if (errJson) log(`errorJson: ${errJson}`);
          console.error('Firebase upload error', err);
        }
      }

      setStatus(`Done. Migrated ${migrated}, skipped ${skipped}, failed ${failed}.`);
      log("Migration complete.");
      btn.disabled = false;
    }

    btn.addEventListener("click", () => {
      migrateAll().catch(err => {
        setStatus('Migration could not start.');
        log("Unexpected error: " + (err.message || err));
        btn.disabled = false;
        closeDb();
      });
    });
  </script>
</body>
</html>
