    html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}

  <script type="text/plain" id="fastTournamentPatch">
      html = replaceRange(
        html,
        `    async function idbGetAllItems(){`,
        `    async function idbGetItem(id){`,
        `    const TOURNEY_INDEX_DB_NAME = 'modelMatchupTourneyIndexDB';
    const TOURNEY_INDEX_STORE = 'items';
    const TOURNEY_INDEX_META_ID = '__meta__';
    const TOURNEY_INDEX_MAX_AGE_MS = 12 * 60 * 60 * 1000;

    function openTourneyIndexDB(){
      return openDBWithTimeout(TOURNEY_INDEX_DB_NAME, 1, TOURNEY_INDEX_STORE);
    }

    async function readMainItemCount(){
      const db = await openItemsDB();
      return new Promise((resolve,reject)=>{
        try{
          const tx = db.transaction(DB_STORE,'readonly');
          const req = tx.objectStore(DB_STORE).count();
          req.onsuccess = ()=>resolve(Number(req.result || 0));
          req.onerror = ()=>reject(req.error || new Error('Failed to count image records.'));
        }catch(err){
          reject(err);
        }
      });
    }

    async function readTourneyIndexSnapshot(){
      const db = await openTourneyIndexDB();
      return new Promise((resolve,reject)=>{
        let rows = [];
        let settled = false;
        const finish = (fn)=>{
          if(settled) return;
          settled = true;
          try{ db.close(); }catch(_e){}
          fn();
        };
        try{
          const tx = db.transaction(TOURNEY_INDEX_STORE,'readonly');
          const req = tx.objectStore(TOURNEY_INDEX_STORE).getAll();
          req.onsuccess = ()=>{ rows = Array.isArray(req.result) ? req.result : []; };
          req.onerror = ()=>finish(()=>reject(req.error || new Error('Failed to read tournament index.')));
          tx.oncomplete = ()=>{
            const meta = rows.find(row=>row && row.id === TOURNEY_INDEX_META_ID) || null;
            const items = rows.filter(row=>row && row.id && row.id !== TOURNEY_INDEX_META_ID);
            finish(()=>resolve({
              complete: !!(meta && meta.complete),
              builtAt: Number(meta && meta.builtAt || 0),
              items
            }));
          };
          tx.onerror = ()=>finish(()=>reject(tx.error || new Error('Tournament index read failed.')));
          tx.onabort = ()=>finish(()=>reject(tx.error || new Error('Tournament index read aborted.')));
        }catch(err){
          finish(()=>reject(err));
        }
      });
    }

    function tourneyIndexSlim(item){
      if(!item || !item.id) return null;
      const hasThumb = !!(item.thumbnail || item.thumbDataUrl || item.hasThumb);
      const { dataUrl, thumbnail, thumbDataUrl, ...rest } = item;
      return { ...rest, id:item.id, hasThumb };
    }

    async function writeTourneyIndexSnapshot(sourceItems){
      const slimItems = (Array.isArray(sourceItems) ? sourceItems : [])
        .map(tourneyIndexSlim)
        .filter(Boolean);
      const db = await openTourneyIndexDB();
      return new Promise((resolve,reject)=>{
        let settled = false;
        const finish = (fn)=>{
          if(settled) return;
          settled = true;
          try{ db.close(); }catch(_e){}
          fn();
        };
        try{
          const tx = db.transaction(TOURNEY_INDEX_STORE,'readwrite');
          const st = tx.objectStore(TOURNEY_INDEX_STORE);
          st.clear();
          for(const item of slimItems) st.put(item);
          st.put({
            id:TOURNEY_INDEX_META_ID,
            complete:true,
            builtAt:Date.now(),
            itemCount:slimItems.length
          });
          tx.oncomplete = ()=>finish(resolve);
          tx.onerror = ()=>finish(()=>reject(tx.error || new Error('Tournament index write failed.')));
          tx.onabort = ()=>finish(()=>reject(tx.error || new Error('Tournament index write aborted.')));
        }catch(err){
          finish(()=>reject(err));
        }
      });
    }

    async function idbGetAllItemsFromMain(){
      const db = await openItemsDB();
      return new Promise((res,rej)=>{
        const tx = db.transaction(DB_STORE,'readonly');
        const st = tx.objectStore(DB_STORE);
        const out = [];
        const cur = st.openCursor();
        cur.onsuccess = e=>{
          const c = e.target.result;
          if(c){
            out.push(stripBigFieldsForMemory(c.value));
            c.continue();
          }
          else res(out);
        };
        cur.onerror = ()=>rej(cur.error);
      });
    }

    async function idbGetAllItems(){
      let snapshot = null;
      let mainCount = null;

      const [cacheResult, countResult] = await Promise.allSettled([
        readTourneyIndexSnapshot(),
        readMainItemCount()
      ]);

      if(cacheResult.status === 'fulfilled') snapshot = cacheResult.value;
      else console.warn('Tournament index unavailable; falling back to full library scan.', cacheResult.reason);

      if(countResult.status === 'fulfilled') mainCount = countResult.value;
      else console.warn('Could not validate tournament index against library count.', countResult.reason);

      const cacheAge = snapshot ? Date.now() - Number(snapshot.builtAt || 0) : Infinity;
      const countMatches = snapshot && (mainCount == null || snapshot.items.length === mainCount);
      const cacheIsFresh = snapshot && snapshot.complete && cacheAge >= 0 && cacheAge < TOURNEY_INDEX_MAX_AGE_MS;

      if(cacheIsFresh && countMatches){
        console.log('[TOURNEY FAST LOAD] using lightweight index', {
          count:snapshot.items.length,
          ageMs:cacheAge
        });
        return snapshot.items;
      }

      console.log('[TOURNEY FAST LOAD] rebuilding lightweight index', {
        cachedCount:snapshot && snapshot.items ? snapshot.items.length : 0,
        mainCount,
        cacheAge
      });
      const rows = await idbGetAllItemsFromMain();
      writeTourneyIndexSnapshot(rows).catch(err=>{
        console.warn('Could not refresh lightweight tournament index.', err);
      });
      return rows;
    }

`,
        'lightweight tournament item index'
      );

        `function renderMissingMatchSide(label, item){`,

      '<div class="imageFailureMsg" data-image-loading="true">'+escapeHtml(loadingText)+'</div>' +

function isHttpUrl(str){`
        ,
        'hydrateable missing-image placeholder'
      );

      html = replaceRange(
        html,
        `    async function hydrateImgEl(imgEl, itemId){`,
        `    async function loadTourneyState(){`,
        `    async function hydrateImgEl(imgEl, itemId){
      if(!imgEl || !itemId) return false;
      const wrapper = imgEl.closest('.imageCard') || imgEl.parentElement;
      const clearLoadingPlaceholder = ()=>{
        if(!wrapper) return;
        const placeholder = wrapper.querySelector('[data-image-loading]');
        if(placeholder) placeholder.remove();
      };
      try{
        const full = await idbGetItem(itemId);
        if(!full){
          clearLoadingPlaceholder();
          showImageFailure(imgEl, 'Image unavailable: record missing.');
          return false;
        }

        const thumbSources = getThumbOnlySources(full);
        let fullSources = dedupeSources([...getFullOnlySources(full), ...thumbSources]);
        let displaySources = thumbSources.length ? thumbSources : getFullOnlySources(full);

        if(!displaySources.length && window.fetchFullImageUrl){
          try{
            const cloudUrl = await window.fetchFullImageUrl(itemId);
            if(cloudUrl){
              fullSources = dedupeSources([cloudUrl, ...fullSources]);
              displaySources = [cloudUrl];
              const memoryItem = itemsById.get(itemId);
              if(memoryItem){
                const updatedMemoryItem = {...memoryItem, fullUrl:cloudUrl};
                itemsById.set(itemId, updatedMemoryItem);
                items = items.map(it=>it.id === itemId ? updatedMemoryItem : it);
              }
            }
          }catch(cloudErr){
            console.warn('Cloud image fallback failed', itemId, cloudErr);
          }
        }

        if(!displaySources.length){
          clearLoadingPlaceholder();
          showImageFailure(imgEl, 'Image unavailable: no local or cloud image source found.');
          return false;
        }

        clearLoadingPlaceholder();
        if(wrapper) wrapper.classList.remove('imageFailed');
        imgEl.dataset.failureShown = '';
        imgEl.dataset.srcs = serializeSources(displaySources);
        imgEl.dataset.fullSrcs = serializeSources(fullSources);
        imgEl.dataset.srcIndex = '0';
        imgEl.style.display = '';
        imgEl.src = displaySources[0];
        return true;
      }catch(err){
        clearLoadingPlaceholder();
        showImageFailure(imgEl, 'Image unavailable: local image lookup failed.');
        console.warn('hydrateImgEl failed', itemId, err);
        return false;
      }
    }

`
        ,
        'on-demand tournament image hydration'
      );

      html = replaceRange(
        html,
        `async function maybeHydrateFullImage(item){`,
        `function escapeHtml(str){`,
        `async function maybeHydrateFullImage(item){
  if(!item || hydratingFullUrls.has(item.id)) return;
  if(item.fullUrl && isHttpUrl(item.fullUrl)) return;
  if(!window.fetchFullImageUrl) return;

  hydratingFullUrls.add(item.id);
  try{
    const url = await window.fetchFullImageUrl(item.id);
    if(url && url !== item.fullUrl){
      const updated = {...item, fullUrl:url};
      itemsById.set(updated.id, updated);
      items = items.map(it => it.id === updated.id ? updated : it);
    }
  }catch(err){
    console.warn('Full image hydration failed for', item && item.id, err);
  }finally{
    hydratingFullUrls.delete(item.id);
  }
}

function escapeHtml(str){`
        ,
        'avoid giant writes during cloud image hydration'
      );

      html = replaceOnce(
        html,
        `      const missingData = !hasLeftRecord || !hasRightRecord || !leftSrc || !rightSrc;`,
        `      const missingData = !hasLeftRecord || !hasRightRecord;`,
        'do not treat lightweight source omission as missing image data'
      );

      const fastLoadRequired = [
        "const TOURNEY_INDEX_DB_NAME = 'modelMatchupTourneyIndexDB'",
        'async function readMainItemCount()',
        'async function readTourneyIndexSnapshot()',
        'async function writeTourneyIndexSnapshot(sourceItems)',
        'async function idbGetAllItemsFromMain()',
        "console.log('[TOURNEY FAST LOAD] using lightweight index'",
        'data-image-loading="true"',
        'Cloud image fallback failed',
        'const missingData = !hasLeftRecord || !hasRightRecord;'
      ];
      const missingFastLoad = fastLoadRequired.filter(snippet=>!html.includes(snippet));
      if(missingFastLoad.length){
        throw new Error('Tournament fast-load patch validation failed: ' + missingFastLoad.join(', '));
      }
  </script>

  <script>
    (async function loadFastTournament(){
      const priorRevision = '6ad55663dc7aaeb6bd9a6e7397f47de7ca672d71';
      const sources = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@' + priorRevision + '/tourney.html',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/' + priorRevision + '/tourney.html'
      ];
      const warmUrls = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@be04f76f96009a52cffeb5dc42333bedfd876110/tourney.html'
      ];

      async function fetchFirst(urls){
        let lastError = null;
        for(const url of urls){
          try{
            const response = await fetch(url, {cache:'force-cache'});
            if(!response.ok) throw new Error(response.status + ' ' + response.statusText);
            return await response.text();
          }catch(error){
            lastError = error;
          }
        }
        throw lastError || new Error('Could not load tournament code.');
      }

      const loaderPromise = fetchFirst(sources);
      for(const url of warmUrls){
        fetch(url,{cache:'force-cache'}).catch(()=>{});
      }
      let loader = await loaderPromise;
      const marker = '      const required = [';
      const count = loader.split(marker).length - 1;
      if(count !== 1){
        throw new Error('Fast tournament loader could not find its patch point.');
      }
      const patch = document.getElementById('fastTournamentPatch').textContent;
      loader = loader.replace(marker, patch + '\n' + marker);

      document.open();
      document.write(loader);
      document.close();
    })().catch(error=>{
      console.error('Fast tournament loader failed', error);
      const target = document.getElementById('loaderError');
      if(target){
        target.textContent = 'Tournament could not finish loading.\n\n' +
          (error && error.message ? error.message : error) +
          '\n\nReload the page to try again.';
      }
    });
  </script>
