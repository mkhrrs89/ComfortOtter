<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModelMatchup — Tournament Mode</title>
  <meta name="theme-color" content="#050c0a" />
  <style>
    html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .loaderCard{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}
    .loaderTitle{font-size:18px;font-weight:700;margin-bottom:8px}
    .loaderDetail{color:#8fb0a1}
    .loaderError{white-space:pre-wrap;text-align:left;color:#ffb4be;margin-top:12px}
  </style>
</head>
<body>
  <div class="loader">
    <div class="loaderCard">
      <div class="loaderTitle">Loading Tournament…</div>
      <div class="loaderDetail">Opening your image library.</div>
      <div id="loaderError" class="loaderError"></div>
    </div>
  </div>
  <script>
    (async function loadTournament(){
      const sourceRevision = 'be04f76f96009a52cffeb5dc42333bedfd876110';
      const appSources = [
        'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@' + sourceRevision + '/tourney.html',
        'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/' + sourceRevision + '/tourney.html'
      ];

      async function fetchFirst(urls, label){
        let lastError = null;
        for(const url of urls){
          try{
            const response = await fetch(url, {cache:'force-cache'});
            if(!response.ok) throw new Error(response.status + ' ' + response.statusText);
            return await response.text();
          }catch(error){
            lastError = error;
          }
        }
        throw new Error('Could not load ' + label + ': ' + (lastError && lastError.message ? lastError.message : lastError));
      }

      function countOccurrences(text, search){
        if(!search) return 0;
        return text.split(search).length - 1;
      }

      function replaceOnce(text, oldText, newText, label){
        const count = countOccurrences(text, oldText);
        if(count !== 1){
          throw new Error(label + ': expected 1 match, found ' + count);
        }
        return text.replace(oldText, newText);
      }

      let html = await fetchFirst(appSources, 'the tournament source');

      html = replaceOnce(
        html,
        `    const OPEN_DB_TIMEOUT_MS = 10000;
    const WRITE_TX_TIMEOUT_MS = 10000;`,
        `    const OPEN_DB_TIMEOUT_MS = 30000;
    const WRITE_TX_TIMEOUT_MS = 30000;`,
        'IndexedDB timeout extension'
      );

      html = replaceOnce(
        html,
        `        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = ()=>{`,
        `        req.onsuccess = () => {
          const db = req.result;
          if(settled){
            try{ db.close(); }catch(e){}
            return;
          }
          db.onversionchange = ()=>{`,
        'late IndexedDB success cleanup'
      );

      html = replaceOnce(
        html,
        `    function openItemsDB(){
      return openDBWithTimeout(DB_NAME, 2, DB_STORE);
    }

    function openTourneyDB(){
      return openDBWithTimeout(TOURNEY_DB_NAME, 2, TOURNEY_STORE);
    }`,
        `    let itemsDbPromise = null;
    let tourneyDbPromise = null;
    const trackedDbConnections = new Set();

    function waitMs(ms){
      return new Promise(resolve=>setTimeout(resolve, ms));
    }

    function closeTrackedDb(db){
      if(!db) return;
      trackedDbConnections.delete(db);
      try{ db.close(); }catch(e){}
    }

    function openExistingDBWithTimeout(name, ensureStoreName, timeoutMs){
      if(!canUseIndexedDB()){
        return Promise.reject(new Error('IndexedDB unavailable on this browser.'));
      }
      return new Promise((resolve,reject)=>{
        let settled = false;
        let req;
        try{
          req = indexedDB.open(name);
        }catch(err){
          reject(err);
          return;
        }

        const timeoutId = setTimeout(()=>{
          if(settled) return;
          settled = true;
          reject(new Error('Timed out opening IndexedDB ' + name + '.'));
        }, timeoutMs);

        const finish = (fn)=>{
          if(settled) return;
          settled = true;
          clearTimeout(timeoutId);
          fn();
        };

        req.onblocked = () => finish(()=>reject(new Error('IndexedDB ' + name + ' is blocked by another tab. Close other app tabs and retry.')));
        req.onerror = () => finish(()=>reject(req.error || new Error('Failed to open IndexedDB ' + name + '.')));
        req.onsuccess = () => {
          const db = req.result;
          if(settled){
            closeTrackedDb(db);
            return;
          }
          if(ensureStoreName && !db.objectStoreNames.contains(ensureStoreName)){
            closeTrackedDb(db);
            finish(()=>reject(new Error('IndexedDB ' + name + ' missing required store ' + ensureStoreName + '.')));
            return;
          }
          trackedDbConnections.add(db);
          finish(()=>resolve(db));
        };
      });
    }

    async function openResilientDB(name, version, storeName){
      let lastError = null;
      const attemptTimeouts = [12000, 18000];

      for(let attempt = 0; attempt < attemptTimeouts.length; attempt++){
        try{
          return await openExistingDBWithTimeout(name, storeName, attemptTimeouts[attempt]);
        }catch(err){
          lastError = err;
          const message = err && err.message ? err.message : String(err || '');
          console.warn('IndexedDB open attempt ' + (attempt + 1) + ' failed for ' + name, err);
          if(message.indexOf('missing required store') !== -1) break;
          if(attempt < attemptTimeouts.length - 1) await waitMs(500 * (attempt + 1));
        }
      }

      try{
        const db = await openDBWithTimeout(name, version, storeName);
        trackedDbConnections.add(db);
        return db;
      }catch(err){
        throw err || lastError;
      }
    }

    function openCachedDB(kind, name, version, storeName){
      const existingPromise = kind === 'items' ? itemsDbPromise : tourneyDbPromise;
      if(existingPromise) return existingPromise;

      const promise = openResilientDB(name, version, storeName)
        .then(db=>{
          db.onversionchange = ()=>{
            closeTrackedDb(db);
            if(kind === 'items') itemsDbPromise = null;
            else tourneyDbPromise = null;
          };
          return db;
        })
        .catch(err=>{
          if(kind === 'items') itemsDbPromise = null;
          else tourneyDbPromise = null;
          throw err;
        });

      if(kind === 'items') itemsDbPromise = promise;
      else tourneyDbPromise = promise;
      return promise;
    }

    function resetCachedDbConnection(kind){
      const promise = kind === 'items' ? itemsDbPromise : tourneyDbPromise;
      if(kind === 'items') itemsDbPromise = null;
      else tourneyDbPromise = null;
      if(promise){
        Promise.resolve(promise).then(db=>closeTrackedDb(db)).catch(()=>{});
      }
    }

    function resetItemsDbConnection(){
      resetCachedDbConnection('items');
    }

    function resetTourneyDbConnection(){
      resetCachedDbConnection('tourney');
    }

    function openItemsDB(){
      return openCachedDB('items', DB_NAME, 2, DB_STORE);
    }

    function openTourneyDB(){
      return openCachedDB('tourney', TOURNEY_DB_NAME, 2, TOURNEY_STORE);
    }

    window.addEventListener('pagehide', ()=>{
      for(const db of Array.from(trackedDbConnections)) closeTrackedDb(db);
      itemsDbPromise = null;
      tourneyDbPromise = null;
    });`,
        'resilient IndexedDB openers'
      );

      html = replaceOnce(
        html,
        `        await delay(200);`,
        `        resetItemsDbConnection();
        await delay(250);`,
        'fresh IndexedDB connection before write retry'
      );

      html = replaceOnce(
        html,
        `    async function saveTourneyState(state){
      return runWriteTransaction(openTourneyDB(), TOURNEY_STORE, (st)=>{
        st.put({...state,id:TOURNEY_STATE_ID});
      }, 'Saving tournament progress');
    }`,
        `    async function saveTourneyState(state){
      let attempt = 0;
      while(true){
        attempt += 1;
        try{
          return await runWriteTransaction(openTourneyDB(), TOURNEY_STORE, (st)=>{
            st.put({...state,id:TOURNEY_STATE_ID});
          }, 'Saving tournament progress');
        }catch(err){
          if(attempt >= 2 || !isRetriableWriteError(err)) throw err;
          resetTourneyDbConnection();
          await delay(250);
        }
      }
    }`,
        'retry tournament-state writes with a fresh connection'
      );

      html = replaceOnce(
        html,
        `  tourneyState = nextTourneyState;
  renderAll();

  try{
    await incrementTourneyCountsForParticipants(participantIds);
  }catch(e){
    const msg = 'Tournament started, but failed to update participant tournament counts.';
    console.error(msg, e);
    alert(msg);
  }`,
        `  tourneyState = nextTourneyState;
  statusEl.textContent = 'Preparing tournament…';

  try{
    await incrementTourneyCountsForParticipants(participantIds);
  }catch(e){
    const msg = 'Tournament started, but failed to update participant tournament counts.';
    console.error(msg, e);
    alert(msg);
  }

  // Do not expose winner buttons until the startup database write is finished.
  // This prevents a first winner tap from waiting behind that large write.
  renderAll();`,
        'prevent winner save from racing tournament startup writes'
      );

      html = replaceOnce(
        html,
        `        await withTimeout(applyWinLoss(winnerId, loserId), 12000, 'Saving winner/loser stats');`,
        `        await withTimeout(applyWinLoss(winnerId, loserId), 70000, 'Saving winner/loser stats');`,
        'winner stats timeout budget'
      );

      html = replaceOnce(
        html,
        `        await withTimeout(saveTourneyState(nextState), 12000, 'Saving tournament state');`,
        `        await withTimeout(saveTourneyState(nextState), 70000, 'Saving tournament state');`,
        'winner state timeout budget'
      );

      const required = [
        'const OPEN_DB_TIMEOUT_MS = 30000;',
        'const WRITE_TX_TIMEOUT_MS = 30000;',
        'function openExistingDBWithTimeout',
        'function resetItemsDbConnection',
        'function resetTourneyDbConnection',
        "openCachedDB('items', DB_NAME, 2, DB_STORE)",
        "openCachedDB('tourney', TOURNEY_DB_NAME, 2, TOURNEY_STORE)",
        "window.addEventListener('pagehide'",
        "statusEl.textContent = 'Preparing tournament…';",
        "70000, 'Saving winner/loser stats'",
        "70000, 'Saving tournament state'",
        'if(settled){\n            try{ db.close(); }catch(e){}'
      ];
      const missing = required.filter(snippet => !html.includes(snippet));
      if(missing.length){
        throw new Error('Tournament IndexedDB patch validation failed: ' + missing.join(', '));
      }

      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      console.error('Tournament failed to load', error);
      const target = document.getElementById('loaderError');
      if(target){
        target.textContent = 'Tournament could not finish loading.\n\n' +
          (error && error.message ? error.message : error) +
          '\n\nReload the page to try again.';
      }
    });
  </script>
</body>
</html>
