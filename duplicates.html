<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Title Twins</title>
  <meta name="theme-color" content="#050c0a" />
  <style>html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}.loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}.muted{color:#8fb0a1}.err{white-space:pre-wrap;color:#ffb4be;margin-top:12px}</style>
</head>
<body>
<div class="loader"><div class="card"><div style="font-size:18px;font-weight:700">Loading Title Twins…</div><div class="muted">Opening the lightweight image index.</div><div id="err" class="err"></div></div></div>
<script>
(async()=>{
  const rev='4e864ae0c4fccf4b2c33586fccc4ecc492f5c670';
  const urls=[
    'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@'+rev+'/duplicates.html',
    'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/'+rev+'/duplicates.html'
  ];
  async function fetchFirst(){let last;for(const u of urls){try{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return await r.text();}catch(e){last=e;}}throw last||new Error('Could not load Title Twins source.');}
  function once(text,oldText,newText,label){const n=text.split(oldText).length-1;if(n!==1)throw new Error(label+': expected 1 match, found '+n);return text.replace(oldText,newText);}
  let html=await fetchFirst();

  html=once(html,
`async function loadAll(){
  const db = await openDB();
  const tx = db.transaction(DB_STORE,'readonly');
  const st = tx.objectStore(DB_STORE);
  const all = [];
  return await new Promise((resolve)=>{
    const req = st.openCursor();
    req.onsuccess = e=>{
      const c = e.target.result;
      if(!c){ resolve(all); return; }
      all.push(c.value);
      c.continue();
    };
  });
}`,
`const FAST_STATS_DB='modelMatchupStatsDB';
const FAST_STATS_STORE='stats';
const TWIN_INDEX_DB='modelMatchupTourneyIndexDB';
const TWIN_INDEX_STORE='items';
const TWIN_INDEX_META='__meta__';
const TWIN_INDEX_MAX_AGE=12*60*60*1000;
let fastStatsById=new Map();

function openNamedDB(name,version,store){
  return new Promise((resolve,reject)=>{
    let done=false;const req=indexedDB.open(name,version);const timer=setTimeout(()=>{if(done)return;done=true;reject(new Error('Timed out opening '+name));},12000);
    const finish=fn=>{if(done)return;done=true;clearTimeout(timer);fn();};
    req.onupgradeneeded=()=>{const db=req.result;if(store&&!db.objectStoreNames.contains(store))db.createObjectStore(store,{keyPath:'id'});};
    req.onsuccess=()=>finish(()=>resolve(req.result));req.onerror=()=>finish(()=>reject(req.error));req.onblocked=()=>finish(()=>reject(new Error(name+' is blocked')));
  });
}
async function getAllFrom(name,version,store){const db=await openNamedDB(name,version,store);try{return await new Promise((resolve,reject)=>{const tx=db.transaction(store,'readonly');const q=tx.objectStore(store).getAll();q.onsuccess=()=>resolve(Array.isArray(q.result)?q.result:[]);q.onerror=()=>reject(q.error);});}finally{try{db.close();}catch(e){}}}
async function mainCount(){const db=await openDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const q=tx.objectStore(DB_STORE).count();q.onsuccess=()=>resolve(Number(q.result||0));q.onerror=()=>reject(q.error);});}finally{try{db.close();}catch(e){}}}
function overlayFastStats(it){const s=it&&fastStatsById.get(it.id);if(!s)return it;const out={...it};for(const k of ['wins','losses','tourneyBonus','tourneyCount','rating','ratingSeededFromWinPctV1'])if(s[k]!==undefined)out[k]=s[k];return out;}
async function loadAll(){
  const [idxRes,countRes,statsRes]=await Promise.allSettled([getAllFrom(TWIN_INDEX_DB,1,TWIN_INDEX_STORE),mainCount(),getAllFrom(FAST_STATS_DB,1,FAST_STATS_STORE)]);
  if(statsRes.status==='fulfilled')fastStatsById=new Map(statsRes.value.map(x=>[x.id,x]));
  if(idxRes.status==='fulfilled'){
    const meta=idxRes.value.find(x=>x&&x.id===TWIN_INDEX_META);const rows=idxRes.value.filter(x=>x&&x.id&&x.id!==TWIN_INDEX_META);const count=countRes.status==='fulfilled'?countRes.value:null;const age=meta?Date.now()-Number(meta.builtAt||0):Infinity;
    if(meta&&meta.complete&&age>=0&&age<TWIN_INDEX_MAX_AGE&&(count==null||rows.length===count))return rows.map(overlayFastStats);
  }
  const db=await openDB();const all=[];
  try{await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const st=tx.objectStore(DB_STORE);const cur=st.openCursor();cur.onsuccess=e=>{const c=e.target.result;if(!c){resolve();return;}const v=c.value||{};const {dataUrl,thumbnail,thumbDataUrl,...rest}=v;all.push({...rest,hasThumb:!!(thumbnail||thumbDataUrl)});c.continue();};cur.onerror=()=>reject(cur.error);});}finally{try{db.close();}catch(e){}}
  return all.map(overlayFastStats);
}
async function getMainItem(id){const db=await openDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly');const q=tx.objectStore(DB_STORE).get(id);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);});}finally{try{db.close();}catch(e){}}}
async function putFastStatPatch(id,patch){const db=await openNamedDB(FAST_STATS_DB,1,FAST_STATS_STORE);try{await new Promise((resolve,reject)=>{const tx=db.transaction(FAST_STATS_STORE,'readwrite');const st=tx.objectStore(FAST_STATS_STORE);const q=st.get(id);q.onsuccess=()=>st.put({...q.result,id,...patch,updatedAt:Date.now()});q.onerror=()=>st.put({id,...patch,updatedAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{try{db.close();}catch(e){}}}
async function putTwinIndexItem(item){const db=await openNamedDB(TWIN_INDEX_DB,1,TWIN_INDEX_STORE);try{await new Promise((resolve,reject)=>{const tx=db.transaction(TWIN_INDEX_STORE,'readwrite');const st=tx.objectStore(TWIN_INDEX_STORE);const {dataUrl,thumbnail,thumbDataUrl,...rest}=item;st.put({...rest,hasThumb:!!(thumbnail||thumbDataUrl||item.hasThumb)});const q=st.get(TWIN_INDEX_META);q.onsuccess=()=>{if(q.result)st.put({...q.result,builtAt:Date.now()});};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{try{db.close();}catch(e){}}}
async function hydrateTwinThumb(img,id){if(!img||!id||img.dataset.hydrated)return;img.dataset.hydrated='1';try{const full=await getMainItem(id);const src=full&&(full.thumbnail||full.thumbDataUrl||full.fullUrl||full.dataUrl);if(src)img.src=src;}catch(e){console.warn('Title Twins image hydration failed',id,e);}}
`, 'fast Title Twins load');

  html=once(html,
`async function patchItem(id, patch){
  const idx = allItems.findIndex(it => it.id === id);
  if(idx === -1) return;

  const updated = Object.assign({}, allItems[idx], patch);
  allItems[idx] = updated;

  const db = await openDB();
  await new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE,'readwrite');
    tx.objectStore(DB_STORE).put(updated);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });

  buildAndRenderGroups();
}`,
`async function patchItem(id, patch){
  const idx=allItems.findIndex(it=>it.id===id);if(idx===-1)return;
  const full=await getMainItem(id);if(!full)throw new Error('Image record not found.');
  const updated={...full,...patch};const db=await openDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(updated);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{try{db.close();}catch(e){}}
  const statPatch={};for(const k of ['wins','losses','tourneyBonus','tourneyCount','rating','ratingSeededFromWinPctV1'])if(patch[k]!==undefined)statPatch[k]=patch[k];if(Object.keys(statPatch).length){await putFastStatPatch(id,statPatch);fastStatsById.set(id,{...(fastStatsById.get(id)||{id}),...statPatch});}
  allItems[idx]=overlayFastStats({...allItems[idx],...patch});await putTwinIndexItem(allItems[idx]);buildAndRenderGroups();
}`, 'safe Title Twins edits');

  html=once(html,`function openPreview(item){`,`async function openPreview(item){\n  const full=await getMainItem(item.id).catch(()=>null);\n  item=overlayFastStats({...item,...(full||{})});`,'preview hydration');
  html=once(html,`const d = item.createdAt ? new Date(item.createdAt) : null;`,`const rawDate=item.createdAt||item.addedAt;\nconst d=rawDate?new Date(rawDate):null;`,'date fallback');
  html=once(html,
`      img.src =
        it.thumbnail ||
        it.thumbDataUrl ||
        it.fullUrl ||
        it.dataUrl ||
        '';`,
`      img.src = it.thumbnail || it.thumbDataUrl || it.fullUrl || it.dataUrl || '';
      img.dataset.itemId=it.id;
      if(!img.src) setTimeout(()=>hydrateTwinThumb(img,it.id),0);`, 'lazy duplicate thumbnails');

  html=once(html,
`  allItems = allItems.filter(it => it.id !== id);
  buildAndRenderGroups();`,
`  allItems = allItems.filter(it => it.id !== id);
  try{const sdb=await openNamedDB(FAST_STATS_DB,1,FAST_STATS_STORE);await new Promise((resolve,reject)=>{const tx=sdb.transaction(FAST_STATS_STORE,'readwrite');tx.objectStore(FAST_STATS_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});sdb.close();}catch(e){}
  try{const idb=await openNamedDB(TWIN_INDEX_DB,1,TWIN_INDEX_STORE);await new Promise((resolve,reject)=>{const tx=idb.transaction(TWIN_INDEX_STORE,'readwrite');tx.objectStore(TWIN_INDEX_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});idb.close();}catch(e){}
  fastStatsById.delete(id);
  buildAndRenderGroups();`, 'delete companion records');

  const required=['FAST_STATS_DB','TWIN_INDEX_DB','overlayFastStats','hydrateTwinThumb','const full=await getMainItem(id)','async function openPreview(item)'];
  const missing=required.filter(x=>!html.includes(x));if(missing.length)throw new Error('Title Twins patch incomplete: '+missing.join(', '));
  document.open();document.write(html);document.close();
})().catch(err=>{console.error(err);const el=document.getElementById('err');if(el)el.textContent=String(err&&err.message||err);});
</script>
</body>
</html>
