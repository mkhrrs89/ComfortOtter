<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Title Twins</title>
  <meta name="theme-color" content="#050c0a" />
  <style>html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}.loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}.muted{color:#8fb0a1}.err{white-space:pre-wrap;color:#ffb4be;margin-top:12px}</style>
</head>
<body>
<div class="loader"><div class="card"><div style="font-size:18px;font-weight:700">Loading Title Twins…</div><div class="muted">Opening the lightweight image index.</div><div id="err" class="err"></div></div></div>
<script>
(async()=>{
  const priorRevision='0b016493770db5e35562f97d53c20e1f50aeb579';
  const urls=[
    'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@'+priorRevision+'/duplicates.html',
    'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/'+priorRevision+'/duplicates.html'
  ];
  const warm=['https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@4e864ae0c4fccf4b2c33586fccc4ecc492f5c670/duplicates.html'];
  async function fetchFirst(){let last;for(const u of urls){try{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return await r.text();}catch(e){last=e;}}throw last||new Error('Could not load Title Twins source.');}
  for(const u of warm)fetch(u,{cache:'force-cache'}).catch(()=>{});
  let wrapper=await fetchFirst();
  const marker="  const required=['FAST_STATS_DB'";
  if(wrapper.split(marker).length-1!==1)throw new Error('Durable Title Twins patch point not found.');
  const patch=String.raw`
  const durableTwinNL=String.fromCharCode(10);
  const twinMapMarker='let fastStatsById=new Map();';
  if(html.split(twinMapMarker).length-1!==1)throw new Error('Title Twins stats map marker not found exactly once.');
  const twinMapReplacement=[
    "const DURABLE_STATS_STORAGE_KEY='modelMatchupDurableStatsV1';",
    "const TWIN_STAT_KEYS=['wins','losses','tourneyBonus','tourneyCount','rating','ratingSeededFromWinPctV1'];",
    'let fastStatsById=new Map();',
    'let durableStatsById=readDurableTwinStats();',
    "function readDurableTwinStats(){try{const s=window.localStorage;const raw=s?s.getItem(DURABLE_STATS_STORAGE_KEY):null;const parsed=raw?JSON.parse(raw):{};return new Map(Object.values(parsed&&typeof parsed==='object'?parsed:{}).filter(x=>x&&x.id).map(x=>[x.id,x]));}catch(e){return new Map();}}",
    "function writeDurableTwinStats(){try{const s=window.localStorage;if(!s)return false;const obj={};for(const [id,row] of durableStatsById)obj[id]=row;s.setItem(DURABLE_STATS_STORAGE_KEY,JSON.stringify(obj));return true;}catch(e){console.warn('Title Twins durable stats write failed',e);return false;}}",
    "function normalizeTwinStat(k,v){if(k==='wins'||k==='losses'||k==='tourneyCount')return Math.max(0,Number(v||0));if(k==='tourneyBonus')return Number(v||0);if(k==='rating')return Math.max(0,Math.min(100,Number(v||0)));if(k==='ratingSeededFromWinPctV1')return !!v;return v;}",
    "function putDurableTwinStatPatch(id,p){if(!id||!p)return;const next={...(durableStatsById.get(id)||{id}),id};let changed=false;for(const k of TWIN_STAT_KEYS){if(Object.prototype.hasOwnProperty.call(p,k)&&p[k]!==undefined){next[k]=normalizeTwinStat(k,p[k]);changed=true;}}if(!changed)return;next.updatedAt=Date.now();durableStatsById.set(id,next);writeDurableTwinStats();}",
    "function deleteDurableTwinStat(id){if(durableStatsById.delete(id))writeDurableTwinStats();}"
  ].join(durableTwinNL);
  html=html.replace(twinMapMarker,twinMapReplacement);

  const overlayOld="function overlayFastStats(it){const s=it&&fastStatsById.get(it.id);if(!s)return it;const out={...it};for(const k of ['wins','losses','tourneyBonus','tourneyCount','rating','ratingSeededFromWinPctV1'])if(s[k]!==undefined)out[k]=s[k];return out;}";
  const overlayNew="function overlayFastStats(it){const s=it&&(durableStatsById.get(it.id)||fastStatsById.get(it.id));if(!s)return it;const out={...it};for(const k of ['wins','losses','tourneyBonus','tourneyCount','rating','ratingSeededFromWinPctV1'])if(s[k]!==undefined)out[k]=s[k];return out;}";
  if(html.split(overlayOld).length-1!==1)throw new Error('Title Twins durable overlay point not found exactly once.');
  html=html.replace(overlayOld,overlayNew);

  const patchItemStart='async function patchItem(id, patch){';
  const patchItemEnd='\nasync function deleteItem(id){';
  const start=html.indexOf(patchItemStart);const end=html.indexOf(patchItemEnd,start);
  if(start<0||end<0)throw new Error('Title Twins patchItem range not found.');
  const patchItemNew=[
    'async function patchItem(id, patch){',
    '  const idx=allItems.findIndex(it=>it.id===id);if(idx===-1)return;',
    "  const statPatch={};for(const k of TWIN_STAT_KEYS)if(patch[k]!==undefined)statPatch[k]=patch[k];",
    '  if(Object.keys(statPatch).length){putDurableTwinStatPatch(id,statPatch);try{await putFastStatPatch(id,statPatch);}catch(e){console.warn(\'Title Twins lightweight stat write failed; durable journal kept the edit.\',e);}fastStatsById.set(id,{...(fastStatsById.get(id)||{id}),...statPatch});}',
    '  const hasNonStat=Object.keys(patch||{}).some(k=>!TWIN_STAT_KEYS.includes(k));',
    "  if(hasNonStat){const full=await getMainItem(id);if(!full)throw new Error('Image record not found.');const updated={...full,...patch};const db=await openDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(updated);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}finally{try{db.close();}catch(e){}}}",
    '  allItems[idx]=overlayFastStats({...allItems[idx],...patch});await putTwinIndexItem(allItems[idx]);buildAndRenderGroups();',
    '}'
  ].join(durableTwinNL);
  html=html.slice(0,start)+patchItemNew+html.slice(end);

  const deleteMarker='  fastStatsById.delete(id);';
  if(html.split(deleteMarker).length-1!==1)throw new Error('Title Twins durable delete point not found exactly once.');
  html=html.replace(deleteMarker,deleteMarker+durableTwinNL+'  deleteDurableTwinStat(id);');
`;
  wrapper=wrapper.replace(marker,patch+'\n'+marker);
  document.open();document.write(wrapper);document.close();
})().catch(err=>{console.error(err);const el=document.getElementById('err');if(el)el.textContent=String(err&&err.message||err);});
</script>
</body>
</html>
