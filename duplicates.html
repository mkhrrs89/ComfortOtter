<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Title Twins</title>
  <meta name="theme-color" content="#050c0a" />
  <style>html,body{height:100%;margin:0;background:#050c0a;color:#e7f5ef;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial,sans-serif}.loader{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:520px;padding:20px;border:1px solid #1b3a2f;border-radius:14px;background:#091612}.muted{color:#8fb0a1}.err{white-space:pre-wrap;color:#ffb4be;margin-top:12px}</style>
</head>
<body>
<div class="loader"><div class="card"><div style="font-size:18px;font-weight:700">Loading Title Twins…</div><div class="muted">Opening the lightweight image index.</div><div id="err" class="err"></div></div></div>
<script>
(async()=>{
  const priorRevision='6131aebbe099bf09fd3944ec0a780f06941e7a8d';
  const urls=[
    'https://cdn.jsdelivr.net/gh/mkhrrs89/ComfortOtter@'+priorRevision+'/duplicates.html',
    'https://raw.githubusercontent.com/mkhrrs89/ComfortOtter/'+priorRevision+'/duplicates.html'
  ];
  async function fetchFirst(){let last;for(const u of urls){try{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(r.status+' '+r.statusText);return await r.text();}catch(e){last=e;}}throw last||new Error('Could not load Title Twins source.');}
  let source=await fetchFirst();
  const marker="  wrapper=wrapper.replace(marker,patch+'\\n'+marker);";
  if(source.split(marker).length-1!==1)throw new Error('Title Twins Firestore queue patch point not found exactly once.');
  const replacement=`  patch += String.raw\`
  const twinCloudNL=String.fromCharCode(10);
  const twinDeleteFn="function deleteDurableTwinStat(id){if(durableStatsById.delete(id))writeDurableTwinStats();}";
  if(html.split(twinDeleteFn).length-1!==1)throw new Error('Title Twins cloud queue helper point not found exactly once.');
  const twinQueueHelpers=[
    "const CLOUD_STATS_QUEUE_KEY='modelMatchupPendingFirestoreStatsV1';",
    "function queueTwinFirestoreStatPatch(id,p){try{if(!id||!p)return;const s=window.localStorage;if(!s)return;const raw=s.getItem(CLOUD_STATS_QUEUE_KEY);const parsed=raw?JSON.parse(raw):{};const q=parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};const existing=q[id]&&typeof q[id]==='object'?q[id]:{id};const next={...existing,id};let changed=false;for(const k of TWIN_STAT_KEYS){if(Object.prototype.hasOwnProperty.call(p,k)&&p[k]!==undefined){next[k]=normalizeTwinStat(k,p[k]);changed=true;}}if(!changed)return;next.queuedAt=Date.now();q[id]=next;s.setItem(CLOUD_STATS_QUEUE_KEY,JSON.stringify(q));}catch(e){console.warn('Title Twins Firestore queue write failed',e);}}",
    twinDeleteFn
  ].join(twinCloudNL);
  html=html.replace(twinDeleteFn,twinQueueHelpers);
  const twinPatchOld="function putDurableTwinStatPatch(id,p){if(!id||!p)return;const next={...(durableStatsById.get(id)||{id}),id};let changed=false;for(const k of TWIN_STAT_KEYS){if(Object.prototype.hasOwnProperty.call(p,k)&&p[k]!==undefined){next[k]=normalizeTwinStat(k,p[k]);changed=true;}}if(!changed)return;next.updatedAt=Date.now();durableStatsById.set(id,next);writeDurableTwinStats();}";
  const twinPatchNew="function putDurableTwinStatPatch(id,p){if(!id||!p)return;const next={...(durableStatsById.get(id)||{id}),id};let changed=false;for(const k of TWIN_STAT_KEYS){if(Object.prototype.hasOwnProperty.call(p,k)&&p[k]!==undefined){next[k]=normalizeTwinStat(k,p[k]);changed=true;}}if(!changed)return;next.updatedAt=Date.now();durableStatsById.set(id,next);writeDurableTwinStats();queueTwinFirestoreStatPatch(id,next);}";
  if(html.split(twinPatchOld).length-1!==1)throw new Error('Title Twins Firestore stat hook not found exactly once.');
  html=html.replace(twinPatchOld,twinPatchNew);
\`;
  wrapper=wrapper.replace(marker,patch+'\\n'+marker);`;
  source=source.replace(marker,replacement);
  document.open();document.write(source);document.close();
})().catch(err=>{console.error(err);const el=document.getElementById('err');if(el)el.textContent=String(err&&err.message||err);});
</script>
</body>
</html>
